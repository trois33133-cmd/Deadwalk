<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEADWALK: The City, The Forest, The Caves</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a0f; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 960px; height: 600px;
    margin: 0 auto;
    top: 50%; transform: translateY(-50%);
    box-shadow: 0 0 0 4px #1a1a24, 0 0 40px rgba(0,0,0,0.8);
    background: #000;
    max-width: 100vw; max-height: 100vh;
  }
  @media (max-width: 980px) {
    #gameContainer { width: 100vw; height: 56.25vw; max-height: 100vh; top: 50%; }
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #d7d7de; z-index: 10;
  }
  .hidden { display: none !important; }
  .pixel-panel {
    background: #16161d; border: 4px solid #3a3a4a;
    box-shadow: inset 0 0 0 2px #0a0a0f;
    padding: 20px 28px; image-rendering: pixelated;
    max-width: 90%; max-height: 88%; overflow-y: auto;
  }
  .title-text { font-size: 42px; letter-spacing: 4px; color: #c73838; text-shadow: 3px 3px 0 #000, 0 0 20px rgba(199,56,56,0.5); margin-bottom: 6px; }
  .subtitle-text { font-size: 14px; color: #7a7a8a; letter-spacing: 3px; margin-bottom: 30px; }
  button.pixel-btn {
    font-family: 'Courier New', monospace; background: #2a2a38; color: #e0e0e8;
    border: 3px solid #4a4a5e; padding: 10px 22px; font-size: 15px; letter-spacing: 1px;
    cursor: pointer; margin: 6px; box-shadow: 3px 3px 0 #000; transition: transform 0.05s;
  }
  button.pixel-btn:hover { background: #3a3a4e; border-color: #6a6a80; }
  button.pixel-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  button.pixel-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.pixel-btn.accent { background: #7a2020; border-color: #c73838; }
  button.pixel-btn.accent:hover { background: #932828; }
  input.name-input {
    font-family: 'Courier New', monospace; background: #0d0d13; color: #e8d060;
    border: 3px solid #4a4a5e; padding: 10px 14px; font-size: 18px; letter-spacing: 2px;
    width: 300px; text-align: center;
  }
  input.name-input:focus { outline: none; border-color: #e8d060; }
  #skipBtn { position: absolute; top: 16px; right: 16px; z-index: 20; }
  .char-select-row { display: flex; gap: 14px; margin: 18px 0; flex-wrap: wrap; justify-content: center; }
  .char-card { width: 130px; padding: 10px 8px; background: #1c1c26; border: 3px solid #3a3a4a; text-align: center; cursor: pointer; transition: transform 0.15s ease; }
  .char-card.selected { border-color: #e8d060; transform: scale(1.12); background: #26261e; z-index: 2; }
  .char-card canvas { image-rendering: pixelated; }
  .char-name { font-size: 12px; margin-top: 6px; color: #cfcfd8; letter-spacing: 1px; }
  .char-detail { width: 620px; max-width: 90vw; min-height: 110px; background: #16161d; border: 3px solid #3a3a4a; padding: 14px 18px; margin-top: 6px; font-size: 13px; line-height: 1.6; color: #b8b8c4; }
  .stat-row { display: flex; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .stat-chip { background: #0d0d13; border: 2px solid #3a3a4a; padding: 4px 10px; font-size: 12px; color: #8fd0ff; }
  .modal-title { font-size: 22px; color: #e8d060; letter-spacing: 2px; margin-bottom: 14px; }
  .profile-row, .summary-row { display: flex; justify-content: space-between; width: 380px; max-width: 80vw; padding: 6px 0; border-bottom: 1px dashed #333; font-size: 14px; }
  .shop-item { display: flex; justify-content: space-between; align-items: center; width: 420px; max-width: 85vw; padding: 10px 12px; margin: 5px 0; background: #1c1c26; border: 2px solid #3a3a4a; }
  .shop-item .info { font-size: 13px; }
  .shop-item .lvl { color: #8fd0ff; font-size: 11px; }
  .hud { position: absolute; top: 0; left: 0; width: 100%; padding: 8px 14px; display: flex; justify-content: space-between; color: #fff; font-size: 13px; z-index: 5; pointer-events: none; text-shadow: 2px 2px 0 #000; }
  .region-row { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .region-card { width: 180px; padding: 16px; background: #1c1c26; border: 3px solid #3a3a4a; text-align: center; cursor: pointer; }
  .region-card.locked { opacity: 0.4; cursor: not-allowed; }
  .region-card:not(.locked):hover { border-color: #e8d060; }
  .region-name { font-size: 15px; margin-top: 8px; color: #e0e0e8; letter-spacing: 1px; }
  .region-sub { font-size: 11px; color: #8a8a98; margin-top: 4px; }

  /* ===== TOUCH CONTROLS ===== */
  #touchLayer { position: absolute; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #touchLayer.active { display: block; }
  .touch-btn {
    position: absolute; pointer-events: auto;
    background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.35);
    color: #fff; font-family: 'Courier New', monospace; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; -webkit-user-select: none; user-select: none;
  }
  .touch-btn:active { background: rgba(255,255,255,0.28); }
  #tBtnLeft { left: 16px; bottom: 40px; width: 58px; height: 58px; }
  #tBtnRight { left: 82px; bottom: 40px; width: 58px; height: 58px; }
  #tBtnJump { right: 172px; bottom: 40px; width: 66px; height: 66px; background: rgba(143,208,255,0.18); border-color: rgba(143,208,255,0.5); }
  #tBtnSlash { right: 96px; bottom: 100px; width: 58px; height: 58px; background: rgba(199,56,56,0.22); border-color: rgba(199,56,56,0.6); }
  #tBtnPistol { right: 20px; bottom: 100px; width: 58px; height: 58px; background: rgba(232,208,96,0.2); border-color: rgba(232,208,96,0.55); }
  #tBtnGrenade { right: 58px; bottom: 168px; width: 58px; height: 58px; background: rgba(90,143,74,0.25); border-color: rgba(90,143,74,0.6); }
  #overworldTouch { position: absolute; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #overworldTouch.active { display: block; }
  #owLeft { left: 16px; bottom: 40px; width: 58px; height: 58px; }
  #owRight { left: 82px; bottom: 40px; width: 58px; height: 58px; }
  #owUp { left: 49px; bottom: 106px; width: 58px; height: 58px; }
  #owEnter { right: 20px; bottom: 40px; width: 74px; height: 74px; background: rgba(143,208,255,0.18); border-color: rgba(143,208,255,0.5); font-size: 11px; }
  #owProfileTouch, #owShopTouch {
    position: absolute; top: 8px; pointer-events: auto;
    background: rgba(40,40,55,0.85); border: 2px solid rgba(255,255,255,0.3); color: #fff;
    font-family: 'Courier New', monospace; font-size: 12px; padding: 10px 14px; border-radius: 6px;
  }
  #owProfileTouch { right: 110px; }
  #owShopTouch { right: 10px; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="600"></canvas>
  <div class="hud hidden" id="hud"></div>

  <!-- CINEMATIC -->
  <div class="overlay" id="screen-cinematic">
    <button class="pixel-btn" id="skipBtn">Skip &raquo;</button>
    <canvas id="cinemaCanvas" width="960" height="600" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
  </div>

  <!-- NAME SELECT -->
  <div class="overlay hidden" id="screen-name">
    <div class="pixel-panel" style="text-align:center;">
      <div class="title-text" style="font-size:28px;">SURVIVOR REGISTRATION</div>
      <div class="subtitle-text">Enter your name to begin</div>
      <input type="text" id="nameInput" class="name-input" maxlength="14" placeholder="YOUR NAME">
      <br>
      <button class="pixel-btn accent" id="nameContinueBtn" style="margin-top:20px;">Continue &raquo;</button>
    </div>
  </div>

  <!-- CHARACTER SELECT -->
  <div class="overlay hidden" id="screen-character">
    <div class="title-text" style="font-size:24px;">CHOOSE YOUR SURVIVOR</div>
    <div class="char-select-row" id="charRow"></div>
    <div class="char-detail" id="charDetail">Select a survivor to view details.</div>
    <button class="pixel-btn accent hidden" id="confirmCharBtn">Confirm Character</button>
  </div>

  <!-- REGION MAP (world select) -->
  <div class="overlay hidden" id="screen-region">
    <div class="title-text" style="font-size:26px;">CHOOSE YOUR REGION</div>
    <div class="region-row" id="regionRow"></div>
    <div style="display:flex; gap:20px; margin-top:22px;">
      <button class="pixel-btn" id="regionProfileBtn">Profile</button>
      <button class="pixel-btn" id="regionShopBtn">Shop</button>
    </div>
  </div>

  <!-- WORLD TRANSITION CUTSCENE -->
  <div class="overlay hidden" id="screen-transition">
    <canvas id="transitionCanvas" width="960" height="600" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
  </div>

  <!-- PROFILE MODAL -->
  <div class="overlay hidden" id="screen-profile">
    <div class="pixel-panel">
      <div class="modal-title">PROFILE</div>
      <div id="profileBody"></div>
      <button class="pixel-btn" id="closeProfileBtn" style="margin-top:16px;">Close</button>
    </div>
  </div>

  <!-- SHOP MODAL -->
  <div class="overlay hidden" id="screen-shop">
    <div class="pixel-panel">
      <div class="modal-title">SHOP <span style="color:#e8d060; font-size:14px;" id="shopCoins"></span></div>
      <div id="shopBody"></div>
      <button class="pixel-btn" id="closeShopBtn" style="margin-top:10px;">Close</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="overlay hidden" id="screen-summary">
    <div class="pixel-panel" style="text-align:center;">
      <div class="modal-title" id="summaryTitle">LEVEL COMPLETE</div>
      <div id="summaryBody"></div>
      <button class="pixel-btn accent" id="summaryContinueBtn" style="margin-top:16px;">Continue &raquo;</button>
    </div>
  </div>

  <!-- BOSS CLEAR CINEMATIC -->
  <div class="overlay hidden" id="screen-bossclear">
    <div class="pixel-panel" style="text-align:center; max-width:600px;">
      <div class="modal-title" style="color:#8fd0ff;">SURVIVOR RESCUED</div>
      <div id="bossClearBody" style="font-size:14px; line-height:1.7; margin-bottom:16px;"></div>
      <button class="pixel-btn accent" id="bossClearContinueBtn">Continue &raquo;</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="screen-gameover">
    <div class="pixel-panel" style="text-align:center;">
      <div class="title-text" style="font-size:30px;">YOU DIED</div>
      <div class="subtitle-text" id="gameOverSub">The city shows no mercy.</div>
      <button class="pixel-btn accent" id="retryBtn">Retry Level</button>
      <button class="pixel-btn" id="toOverworldBtn">Return to Map</button>
    </div>
  </div>

  <!-- TOUCH CONTROLS: gameplay -->
  <div id="touchLayer">
    <div class="touch-btn" id="tBtnLeft">&#9664;</div>
    <div class="touch-btn" id="tBtnRight">&#9654;</div>
    <div class="touch-btn" id="tBtnJump">JUMP</div>
    <div class="touch-btn" id="tBtnSlash">SLASH</div>
    <div class="touch-btn hidden" id="tBtnPistol">GUN</div>
    <div class="touch-btn hidden" id="tBtnGrenade">BOMB</div>
  </div>
  <!-- TOUCH CONTROLS: overworld -->
  <div id="overworldTouch">
    <div class="touch-btn" id="owLeft">&#9664;</div>
    <div class="touch-btn" id="owRight">&#9654;</div>
    <div class="touch-btn" id="owUp">&#9650;</div>
    <div class="touch-btn" id="owEnter">ENTER</div>
    <div id="owProfileTouch">Profile</div>
    <div id="owShopTouch">Shop</div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   GLOBAL CANVAS SETUP
===================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const cinemaCanvas = document.getElementById('cinemaCanvas');
const cctx = cinemaCanvas.getContext('2d');
cctx.imageSmoothingEnabled = false;
const transCanvas = document.getElementById('transitionCanvas');
const tctx = transCanvas.getContext('2d');
tctx.imageSmoothingEnabled = false;

const W = canvas.width, H = canvas.height;

/* =====================================================================
   GAME STATE ENUM
===================================================================== */
const GameState = {
  CINEMATIC: 'CINEMATIC',
  NAME_SELECT: 'NAME_SELECT',
  CHARACTER_SELECT: 'CHARACTER_SELECT',
  REGION_MAP: 'REGION_MAP',
  WORLD_TRANSITION: 'WORLD_TRANSITION',
  OVERWORLD: 'OVERWORLD',
  PROFILE: 'PROFILE',
  SHOP: 'SHOP',
  PLAYING: 'PLAYING',
  SUMMARY: 'SUMMARY',
  BOSS_CLEAR: 'BOSS_CLEAR',
  GAME_OVER: 'GAME_OVER'
};
let state = GameState.CINEMATIC;
let previousModalState = GameState.REGION_MAP;

const SCREEN_MAP = {
  CINEMATIC: 'screen-cinematic',
  NAME_SELECT: 'screen-name',
  CHARACTER_SELECT: 'screen-character',
  REGION_MAP: 'screen-region',
  WORLD_TRANSITION: 'screen-transition',
  PROFILE: 'screen-profile',
  SHOP: 'screen-shop',
  SUMMARY: 'screen-summary',
  BOSS_CLEAR: 'screen-bossclear',
  GAME_OVER: 'screen-gameover'
};

function setState(s) {
  document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
  state = s;
  if (SCREEN_MAP[s]) document.getElementById(SCREEN_MAP[s]).classList.remove('hidden');
  document.getElementById('hud').classList.toggle('hidden', !(s === GameState.PLAYING || s === GameState.OVERWORLD));
  document.getElementById('touchLayer').classList.toggle('active', s === GameState.PLAYING);
  document.getElementById('overworldTouch').classList.toggle('active', s === GameState.OVERWORLD);
  if (s === GameState.PLAYING) {
    const isBossFight = level && (level.def.type === 'boss' || level.def.type === 'miniboss');
    Audio.playMusic(isBossFight ? 'tense' : 'ambient');
  } else if (s === GameState.OVERWORLD || s === GameState.REGION_MAP) {
    Audio.playMusic('ambient');
  } else if (s === GameState.CINEMATIC || s === GameState.BOSS_CLEAR) {
    Audio.playMusic('tense');
  } else if (s === GameState.GAME_OVER) {
    Audio.stopMusic();
  }
}

/* =====================================================================
   AUDIO ENGINE (Web Audio API - fully procedural, no external files)
===================================================================== */
const Audio = {
  ctx: null, master: null, musicGain: null,
  musicNodes: [], currentTrack: null, unlocked: false, musicTimer: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.22;
      this.musicGain.connect(this.master);
      this.unlocked = true;
    } catch (e) { this.unlocked = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); },
  blip(freq, dur, type, vol, freqEnd) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), t0 + dur);
    gain.gain.setValueAtTime(vol || 0.3, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noiseBurst(dur, vol, filterFreq) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const bufferSize = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = this.ctx.createBufferSource();
    src.buffer = buffer;
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = filterFreq || 2000;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol || 0.3, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(filt); filt.connect(gain); gain.connect(this.master);
    src.start(t0);
  },
  sfxSwing() { this.blip(320, 0.12, 'triangle', 0.25, 180); },
  sfxGunshot() { this.noiseBurst(0.12, 0.35, 4000); this.blip(140, 0.08, 'square', 0.2, 60); },
  sfxExplosion() { this.noiseBurst(0.5, 0.5, 900); this.blip(70, 0.4, 'sawtooth', 0.3, 30); },
  sfxJump() { this.blip(220, 0.15, 'sine', 0.2, 340); },
  sfxCoin() { this.blip(880, 0.08, 'square', 0.18, 1320); setTimeout(()=>this.blip(1320,0.08,'square',0.14),40); },
  sfxZombieHit() { this.blip(110, 0.1, 'sawtooth', 0.22, 60); },
  sfxPlayerHurt() { this.noiseBurst(0.18, 0.3, 700); this.blip(90, 0.2, 'sawtooth', 0.25, 40); },
  playMusic(track) {
    if (!this.ctx || this.currentTrack === track) return;
    this.stopMusic();
    this.currentTrack = track;
    const bpm = track === 'tense' ? 150 : 68;
    const stepTime = 60 / bpm;
    const scaleAmbient = [55, 58, 61, 63, 66];
    const scaleTense = [82, 87, 98, 87, 73, 82];
    let step = 0;
    const self = this;
    const playStep = () => {
      if (self.currentTrack !== track || !self.ctx) return;
      const scale = track === 'tense' ? scaleTense : scaleAmbient;
      const freq = scale[step % scale.length] * (track === 'tense' ? 2 : 1);
      const t0 = self.ctx.currentTime;
      const osc = self.ctx.createOscillator();
      const gain = self.ctx.createGain();
      osc.type = track === 'tense' ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(track === 'tense' ? 0.5 : 0.35, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + stepTime * 0.9);
      osc.connect(gain); gain.connect(self.musicGain);
      osc.start(t0); osc.stop(t0 + stepTime);
      if (track === 'ambient' && step % 4 === 0) {
        const drone = self.ctx.createOscillator();
        const dgain = self.ctx.createGain();
        drone.type = 'triangle'; drone.frequency.value = freq / 2;
        dgain.gain.setValueAtTime(0.0001, t0);
        dgain.gain.linearRampToValueAtTime(0.12, t0 + 0.2);
        dgain.gain.exponentialRampToValueAtTime(0.0001, t0 + stepTime * 3.6);
        drone.connect(dgain); dgain.connect(self.musicGain);
        drone.start(t0); drone.stop(t0 + stepTime * 4);
      }
      step++;
      self.musicTimer = setTimeout(playStep, stepTime * 1000);
    };
    playStep();
  },
  stopMusic() { this.currentTrack = null; if (this.musicTimer) clearTimeout(this.musicTimer); }
};
function unlockAudioOnce() {
  Audio.init();
  Audio.resume();
  window.removeEventListener('pointerdown', unlockAudioOnce);
  window.removeEventListener('keydown', unlockAudioOnce);
}
window.addEventListener('pointerdown', unlockAudioOnce);
window.addEventListener('keydown', unlockAudioOnce);

/* =====================================================================
   SPEECH SYNTHESIS NARRATION
===================================================================== */
const Narrator = {
  voice: null,
  pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    this.voice = voices.find(v => /male/i.test(v.name)) || voices.find(v => /David|Daniel|Fred|Alex/i.test(v.name)) || voices[0] || null;
  },
  say(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      if (!this.voice) this.pickVoice();
      const utter = new SpeechSynthesisUtterance(text);
      utter.pitch = 0.55; utter.rate = 0.92; utter.volume = 0.85;
      if (this.voice) utter.voice = this.voice;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech synthesis unavailable - never block gameplay */ }
  },
  stop() { if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} } }
};
if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = () => Narrator.pickVoice(); }

/* =====================================================================
   CHARACTERS
===================================================================== */
const CHARACTERS = [
  { id: 'brawler', name: 'The Brawler', color: '#c75a3a', desc: 'A former dockworker who fights zombies bare-knuckle. Slow but hits like a truck.', stats: { health: 140, speed: 3.2, attack: 24 }, trait: 'Trait: +30% melee damage' },
  { id: 'scavenger', name: 'The Scavenger', color: '#5a8f4a', desc: 'Survived by staying light on his feet and looting everything in sight.', stats: { health: 100, speed: 4.6, attack: 16 }, trait: 'Trait: +20% coin pickups' },
  { id: 'medic', name: 'The Medic', color: '#e0e0e0', desc: 'Once an ER nurse. Keeps herself standing longer than anyone else out there.', stats: { health: 160, speed: 3.6, attack: 14 }, trait: 'Trait: Slow passive health regen' },
  { id: 'sharpshooter', name: 'The Sharpshooter', color: '#4a6f9f', desc: 'Ex-military marksman. Precise, calm under pressure, deadly up close too.', stats: { health: 110, speed: 4.0, attack: 20 }, trait: 'Trait: +15% critical chance' },
  { id: 'biker', name: 'The Biker', color: '#8a3a8a', desc: 'Rides the ruins of the highway. Reckless, fast, and always first into a fight.', stats: { health: 120, speed: 5.2, attack: 18 }, trait: 'Trait: +25% movement speed' }
];

/* =====================================================================
   ZOMBIE TYPES (per-world roster)

const UPGRADE_DEFS = {
  health: { label: 'Max Health', perLevel: 15, baseCost: 40, costMult: 1.6, max: 6 },
  armor:  { label: 'Armor / Defense', perLevel: 2, baseCost: 50, costMult: 1.7, max: 6 },
  damage: { label: 'Damage Output', perLevel: 4, baseCost: 45, costMult: 1.65, max: 6 },
  speed:  { label: 'Speed', perLevel: 0.35, baseCost: 35, costMult: 1.6, max: 5 }
};
const WEAPON_DEFS = {
  pistol:  { label: 'Pistol', cost: 500, desc: 'High-velocity bullets. Press K or Right-Click to fire.', maxAmmo: 24, regenMs: 2600 },
  grenade: { label: 'Grenades', cost: 500, desc: 'Explosive AoE arc-throw. Press L to throw.', maxAmmo: 4, regenMs: 9000 }
};
function recomputePlayerStats() {
  const c = player.character;
  player.maxHealth = c.stats.health + player.upgrades.health * UPGRADE_DEFS.health.perLevel;
  player.baseAttack = c.stats.attack + player.upgrades.damage * UPGRADE_DEFS.damage.perLevel;
  player.baseSpeed = c.stats.speed + player.upgrades.speed * UPGRADE_DEFS.speed.perLevel;
  player.armor = player.upgrades.armor * UPGRADE_DEFS.armor.perLevel;
  if (c.id === 'brawler') player.baseAttack *= 1.3;
  if (c.id === 'biker') player.baseSpeed *= 1.25;
}
function upgradeCost(key) {
  const def = UPGRADE_DEFS[key];
  return Math.round(def.baseCost * Math.pow(def.costMult, player.upgrades[key]));
}

/* =====================================================================
   LOCALSTORAGE SAVE / LOAD
===================================================================== */
const SAVE_KEY = 'deadwalk_save_v2';
function saveGame() {
  try {
    const data = {
      name: player.name,
      characterId: player.character ? player.character.id : null,
      coins: player.coins, lifetimeCoins: player.lifetimeCoins, zombiesSlain: player.zombiesSlain,
      upgrades: player.upgrades, weapons: player.weapons, ammo: player.ammo,
      hasDoubleJump: player.hasDoubleJump, unlockedAbilities: player.unlockedAbilities,
      unlockedWorlds: player.unlockedWorlds, furthestLevelByWorld: player.furthestLevelByWorld,
      clearedLevels: WORLDS.map(w => w.levels.map(l => l.cleared))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) { /* storage unavailable - progress just won't persist */ }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.characterId) return false;
    player.name = data.name || 'Survivor';
    player.character = CHARACTERS.find(c => c.id === data.characterId) || CHARACTERS[0];
    player.coins = data.coins || 0;
    player.lifetimeCoins = data.lifetimeCoins || 0;
    player.zombiesSlain = data.zombiesSlain || 0;
    player.upgrades = Object.assign({ health: 0, armor: 0, damage: 0, speed: 0 }, data.upgrades || {});
    player.weapons = Object.assign({ pistol: false, grenade: false }, data.weapons || {});
    player.ammo = Object.assign({ pistol: 0, grenade: 0 }, data.ammo || {});
    player.hasDoubleJump = !!data.hasDoubleJump;
    player.unlockedAbilities = data.unlockedAbilities || [];
    player.unlockedWorlds = data.unlockedWorlds && data.unlockedWorlds.length ? data.unlockedWorlds : [0];
    player.furthestLevelByWorld = data.furthestLevelByWorld || [1, 1, 1];
    if (data.clearedLevels) {
      data.clearedLevels.forEach((arr, wi) => {
        if (!WORLDS[wi]) return;
        arr.forEach((cleared, li) => { if (WORLDS[wi].levels[li]) WORLDS[wi].levels[li].cleared = cleared; });
      });
    }
    recomputePlayerStats();
    player.health = player.maxHealth;
    return true;
  } catch (e) { return false; }
}

   OPENING CINEMATIC (motion-comic style, ~10s, skippable, narrated)
===================================================================== */
const cinematicScenes = [
  { duration: 2600, draw: drawSceneSkyline, line: 'The outbreak began without warning.' },
  { duration: 2600, draw: drawScenePanic, line: 'People ran. The streets emptied in hours.' },
  { duration: 2600, draw: drawSceneOutbreak, line: 'And the dead did not stay down.' },
  { duration: 2200, draw: drawSceneAftermath, line: 'One survivor must reclaim the city.' }
];
let cinematicStart = performance.now();
let cinematicSceneIndexSpoken = -1;

function drawSceneSkyline(t, progress) {
  const pan = -40 * progress;
  cctx.fillStyle = '#0d1420'; cctx.fillRect(0, 0, W, H);
  const grad = cctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a2438'); grad.addColorStop(1, '#3a2f3a');
  cctx.fillStyle = grad; cctx.fillRect(0, 0, W, H * 0.7);
  cctx.save(); cctx.translate(pan, 0);
  for (let i = -1; i < 8; i++) {
    const bx = i * 140 + 60, bh = 180 + ((i * 53) % 220);
    cctx.fillStyle = i % 2 === 0 ? '#232838' : '#1c2030';
    cctx.fillRect(bx, H * 0.7 - bh, 100, bh + 200);
    cctx.fillStyle = '#e8c04a';
    for (let wy = H * 0.7 - bh + 12; wy < H * 0.68; wy += 20) {
      for (let wx = bx + 10; wx < bx + 90; wx += 18) { if ((Math.floor(wx + wy) % 3) === 0) cctx.fillRect(wx, wy, 8, 10); }
    }
  }
  cctx.restore();
  cctx.fillStyle = '#111621'; cctx.fillRect(0, H * 0.68, W, H * 0.32);
  drawCaption('THE OUTBREAK BEGAN WITHOUT WARNING...');
}
function drawScenePanic(t, progress) {
  cctx.fillStyle = '#241a1a'; cctx.fillRect(0, 0, W, H);
  cctx.fillStyle = '#2c2020'; cctx.fillRect(0, H*0.6, W, H*0.4);
  const zoom = 1 + 0.06 * progress;
  cctx.save(); cctx.translate(W/2, H/2); cctx.scale(zoom, zoom); cctx.translate(-W/2, -H/2);
  for (let i = 0; i < 10; i++) {
    const px = ((i * 97 + progress * 60) % (W + 80)) - 40, py = H * 0.62 + (i % 3) * 26;
    cctx.fillStyle = '#d8c8a0'; cctx.fillRect(px, py, 10, 24);
    cctx.fillStyle = '#3a3028'; cctx.fillRect(px - 2, py + 24, 14, 6);
  }
  cctx.restore();
  drawCaption('PEOPLE RAN. THE STREETS EMPTIED IN HOURS.');
}
function drawSceneOutbreak(t, progress) {
  cctx.fillStyle = '#1a2418'; cctx.fillRect(0, 0, W, H);
  cctx.fillStyle = '#101a10'; cctx.fillRect(0, H*0.6, W, H*0.4);
  const slide = -30 * progress;
  cctx.save(); cctx.translate(slide, 0);
  for (let i = 0; i < 7; i++) {
    const zx = i * 130 + 80, zy = H * 0.6;
    cctx.fillStyle = '#5a6b45'; cctx.fillRect(zx, zy, 22, 38);
    cctx.fillStyle = '#8fae6a'; cctx.fillRect(zx + 4, zy - 14, 14, 16);
    cctx.fillStyle = '#c73838'; cctx.fillRect(zx + 6, zy - 8, 4, 3); cctx.fillRect(zx + 12, zy - 8, 4, 3);
  }
  cctx.restore();
  drawCaption('AND THE DEAD DID NOT STAY DOWN.');
}
function drawSceneAftermath(t, progress) {
  cctx.fillStyle = '#15151d'; cctx.fillRect(0, 0, W, H);
  const alpha = Math.min(1, progress * 1.5);
  cctx.globalAlpha = alpha; cctx.fillStyle = '#c73838'; cctx.font = 'bold 46px Courier New'; cctx.textAlign = 'center';
  cctx.fillText('DEADWALK', W/2, H/2 - 10);
  cctx.globalAlpha = 1;
  drawCaption('ONE SURVIVOR MUST RECLAIM THE CITY.');
}
function drawCaption(text) {
  cctx.textAlign = 'center'; cctx.font = '16px Courier New';
  cctx.fillStyle = 'rgba(0,0,0,0.55)'; cctx.fillRect(W/2 - 320, H - 70, 640, 44);
  cctx.fillStyle = '#e0e0e8'; cctx.fillText(text, W/2, H - 44);
}
function runCinematic(now) {
  const elapsed = now - cinematicStart;
  let acc = 0;
  for (let i = 0; i < cinematicScenes.length; i++) {
    const scene = cinematicScenes[i];
    if (elapsed < acc + scene.duration) {
      if (cinematicSceneIndexSpoken !== i) { cinematicSceneIndexSpoken = i; Narrator.say(scene.line); }
      scene.draw(elapsed, (elapsed - acc) / scene.duration);
      return;
    }
    acc += scene.duration;
  }
  goToNameSelect();
}

function travelToWorld(idx) {

function runWorldTransition(fromIdx, toIdx) {
  setState(GameState.WORLD_TRANSITION);
  const fromWorld = WORLDS[fromIdx], toWorld = WORLDS[toIdx];
  const duration = 3400;
  const start = performance.now();
  function frame(now) {
    if (state !== GameState.WORLD_TRANSITION) return;
    const p = Math.min(1, (now - start) / duration);
    tctx.fillStyle = fromWorld.bgColor; tctx.fillRect(0, 0, W, H/2);
    tctx.fillStyle = toWorld.bgColor; tctx.fillRect(0, H/2, W, H/2);
    tctx.fillStyle = fromWorld.groundColor; tctx.fillRect(0, H/2 - 30, W, 30);
    tctx.fillStyle = toWorld.groundColor; tctx.fillRect(0, H/2, W, 30);
    const ax = 60 + p * (W - 120);
    const ay = H/2 - 30 + Math.sin(p * 40) * 2;
    drawWorldMapAvatar(ax, ay);
    tctx.textAlign = 'center'; tctx.font = '14px Courier New'; tctx.fillStyle = '#fff';
    tctx.fillText(fromWorld.name.toUpperCase() + '  \u2192  ' + toWorld.name.toUpperCase(), W/2, 40);
    tctx.fillStyle = 'rgba(0,0,0,0.5)'; tctx.fillRect(W/2 - 200, H - 60, 400, 36);
    tctx.fillStyle = '#e0e0e8'; tctx.font = '13px Courier New';
    tctx.fillText('Traveling to ' + toWorld.name + '...', W/2, H - 37);
    if (p < 1) requestAnimationFrame(frame);
    else { enterOverworld(); }
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   OVERWORLD (Mario-style per-world map)
===================================================================== */
const overworld = { avatarNodeIndex: 0, avatarX: 0, avatarY: 0, nodePositions: [] };

function computeNodePositions() {
  const positions = [];
  const cols = 5;
  for (let i = 0; i < 10; i++) {
    const row = Math.floor(i / cols);
    const colInRow = i % cols;
    const xBase = 100 + colInRow * 170;
    const x = row % 2 === 0 ? xBase : (100 + (cols - 1 - colInRow) * 170);
    const y = 150 + row * 260;
    positions.push({ x, y });
  }
  return positions;
}
function enterOverworld() {
  overworld.nodePositions = computeNodePositions();
  const idx = Math.min(player.furthestLevelByWorld[player.currentWorld] - 1, 9);
  overworld.avatarNodeIndex = idx;
  const p = overworld.nodePositions[idx];
  overworld.avatarX = p.x; overworld.avatarY = p.y;
  setState(GameState.OVERWORLD);
}
function handleOverworldKeydown(e) { if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'KeyW') tryEnterLevelAtCurrentNode(); }
function handleOverworldClick(mx, my) {
  if (my < 40) {
    if (mx > W - 260 && mx < W - 165) { openProfile(); return; }
    if (mx > W - 160 && mx < W - 70) { openShop(); return; }
    if (mx > 10 && mx < 130) { enterRegionMap(); return; }
  }
  overworld.nodePositions.forEach((p, i) => {
    const dist = Math.hypot(mx - p.x, my - p.y);
    const maxIdx = player.furthestLevelByWorld[player.currentWorld] - 1;
    if (dist < 26 && i <= maxIdx) { overworld.avatarNodeIndex = i; overworld.avatarX = p.x; overworld.avatarY = p.y; }
  });
}
function tryEnterLevelAtCurrentNode() {
  const idx = overworld.avatarNodeIndex;
  const maxIdx = player.furthestLevelByWorld[player.currentWorld] - 1;
  if (idx > maxIdx) return;
  startLevel(idx + 1);
}
function updateOverworldMovement() {
  const speed = 3.2;
  let dx = 0, dy = 0;
  if (keys['ArrowRight'] || keys['KeyD'] || touchState.right) dx = 1;
  if (keys['ArrowLeft'] || keys['KeyA'] || touchState.left) dx = -1;
  if (keys['ArrowDown'] || keys['KeyS']) dy = 1;
  if (touchState.up) dy = -1;
  if (dx === 0 && dy === 0) return;
  const positions = overworld.nodePositions;
  const cur = positions[overworld.avatarNodeIndex];
  let best = -1, bestScore = -Infinity;
  const maxIdx = player.furthestLevelByWorld[player.currentWorld] - 1;
  [overworld.avatarNodeIndex - 1, overworld.avatarNodeIndex + 1].forEach(ni => {
    if (ni < 0 || ni > 9 || ni > maxIdx) return;
    const np = positions[ni];
    const vx = np.x - cur.x, vy = np.y - cur.y;
    const len = Math.hypot(vx, vy) || 1;
    const score = (vx/len) * dx + (vy/len) * dy;
    if (score > 0.3 && score > bestScore) { bestScore = score; best = ni; }
  });
  if (best === -1) return;
  const target = positions[best];
  const vx = target.x - overworld.avatarX, vy = target.y - overworld.avatarY;
  const dist = Math.hypot(vx, vy);
  if (dist < speed) { overworld.avatarX = target.x; overworld.avatarY = target.y; overworld.avatarNodeIndex = best; }
  else { overworld.avatarX += (vx / dist) * speed; overworld.avatarY += (vy / dist) * speed; }
}
function drawOverworld() {
  const world = WORLDS[player.currentWorld];
  ctx.fillStyle = world.bgColor; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 8; i++) ctx.fillRect(i * 130 + 20, 0, 60, H);

  const positions = overworld.nodePositions;
  ctx.strokeStyle = '#4a4a56'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); positions.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.stroke();
  ctx.strokeStyle = '#2c2c34'; ctx.lineWidth = 3;
  ctx.beginPath(); positions.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }); ctx.stroke();

  const maxIdx = player.furthestLevelByWorld[player.currentWorld] - 1;
  positions.forEach((p, i) => {
    const lvlDef = world.levels[i];
    const unlocked = i <= maxIdx;
    const cleared = lvlDef.cleared;
    let fill = unlocked ? '#3a3a48' : '#222228';
    if (lvlDef.type === 'boss') fill = unlocked ? '#7a2020' : '#331616';
    else if (lvlDef.type === 'miniboss') fill = unlocked ? '#7a5a20' : '#332816';
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = cleared ? '#8fd056' : (unlocked ? '#e8d060' : '#4a4a52');
    ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = unlocked ? '#fff' : '#666';
    ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), p.x, p.y + 5);
    if (lvlDef.type === 'boss') { ctx.font = '10px Courier New'; ctx.fillStyle = '#ffb0b0'; ctx.fillText('BOSS', p.x, p.y - 32); }
    if (lvlDef.type === 'miniboss') { ctx.font = '10px Courier New'; ctx.fillStyle = '#ffe0a0'; ctx.fillText('MINI-BOSS', p.x, p.y - 32); }
    if (cleared) { ctx.font = '14px Courier New'; ctx.fillStyle = '#8fd056'; ctx.fillText('\u2713', p.x + 30, p.y - 22); }
  });

  drawWorldMapAvatar(overworld.avatarX, overworld.avatarY);

  ctx.textAlign = 'left'; ctx.font = '13px Courier New'; ctx.fillStyle = '#fff';
  ctx.fillText(world.name.toUpperCase() + ' - WORLD ' + world.id, 140, 24);
  ctx.fillText('Coins: ' + player.coins, 140, 44);
  ctx.textAlign = 'right'; ctx.fillStyle = '#cfcfd8';
  ctx.fillText('[E/Space to enter level]', W - 14, H - 14);

  drawTopButton(10, 8, 120, 26, '\u2190 Region Map');
  drawTopButton(W - 260, 8, 95, 26, 'Profile');
  drawTopButton(W - 160, 8, 90, 26, 'Shop');
}
function drawTopButton(x, y, w, h, label) {
  ctx.fillStyle = '#2a2a38'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a5a68'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#e0e0e8'; ctx.font = '12px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 4);
}
function drawWorldMapAvatar(x, y) {
  const c = player.character;
  const g = (state === GameState.WORLD_TRANSITION) ? tctx : ctx;
  g.fillStyle = c.color; g.fillRect(x - 8, y - 20, 16, 20);
  g.fillStyle = '#e0c8a0'; g.fillRect(x - 6, y - 32, 12, 12);
  g.fillStyle = '#2a2a30'; g.fillRect(x - 8, y, 6, 10); g.fillRect(x + 2, y, 6, 10);
}

function renderShop() {

  body.innerHTML = '';
  Object.keys(UPGRADE_DEFS).forEach(key => {

    const cost = maxed ? 0 : upgradeCost(key);
    const row = document.createElement('div');
    row.className = 'shop-item';
    row.innerHTML = `
      <div class="info"><strong>${def.label}</strong><div class="lvl">Level ${lvl}/${def.max}</div></div>

      saveGame(); renderShop();

   LEVEL / GAMEPLAY

let level = null;
const CAMERA_BUFFER = 200;

function startLevel(levelNum) {
  const world = WORLDS[player.currentWorld];
  const def = world.levels[levelNum - 1];
  const groundY = H - 90;
  level = {
    num: levelNum, def, world, groundY,
    camX: 0, levelWidth: world.levelWidth,
    zombies: [], terrain: [], groundGaps: [], lavaZones: [], stalactiteTimer: 1500,
    bullets: [], grenades: [], explosions: [], enemyProjectiles: [],
    damageNumbers: [], slashParticles: [],
    zombiesSlainThisLevel: 0, coinsThisLevel: 0, survivorsSavedThisLevel: 0,
    survivorRescueX: null, survivorRescued: false, bossCleared: false,
    lastAttackTime: -9999, attackCooldown: 380,
    lastBulletTime: -9999, bulletCooldown: 260,
    lastGrenadeTime: -9999, grenadeCooldown: 900,
    lastSafeX: 60, lastSafeY: groundY - 48,
    spikeCooldown: 0, lavaTickTimer: 0
  };
  player.px = 60; player.py = groundY - 48;
  player.pvx = 0; player.pvy = 0;
  player.onGround = true; player.jumpCount = 0;
  player.maxJumps = player.hasDoubleJump ? 2 : 1;
  player.facing = 1;
  player.health = player.maxHealth;
  populateLevel(level);
  document.getElementById('tBtnPistol').classList.toggle('hidden', !player.weapons.pistol);
  document.getElementById('tBtnGrenade').classList.toggle('hidden', !player.weapons.grenade);
  setState(GameState.PLAYING);
}

function populateLevel(lv) {
  const world = lv.world;
  const [lo, hi] = world.zombieLevelRange;
  const isBoss = lv.def.type === 'boss';
  const isMini = lv.def.type === 'miniboss';

  if (world.hazardSet.includes('crate')) {
    for (let x = 300; x < lv.levelWidth - 300; x += 260 + (x % 3) * 40) {
      lv.terrain.push({ x, y: lv.groundY - 34, w: 34, h: 34, type: 'crate' });
    }
  }
  if (world.hazardSet.includes('pit')) {
    for (let x = 600; x < lv.levelWidth - 600; x += 700 + (x % 5) * 60) {
      const gapW = 70 + (x % 3) * 20;
      lv.groundGaps.push({ x1: x, x2: x + gapW });
      if (x % 2 === 0) lv.terrain.push({ x: x + gapW/2 - 20, y: lv.groundY - 60, w: 40, h: 12, type: 'platform' });
    }
  }
  if (world.hazardSet.includes('spike')) {
    for (let x = 450; x < lv.levelWidth - 450; x += 500 + (x % 4) * 70) {
      lv.terrain.push({ x, y: lv.groundY - 14, w: 30, h: 14, type: 'spike' });
    }
  }
  if (world.hazardSet.includes('crumble')) {
    for (let x = 380; x < lv.levelWidth - 380; x += 340 + (x % 3) * 50) {
      lv.terrain.push({ x, y: lv.groundY - 70, w: 60, h: 14, type: 'crumble', standTimer: 0, broken: false, respawnAt: 0 });
    }
  }
  if (world.hazardSet.includes('lava')) {
    for (let x = 700; x < lv.levelWidth - 700; x += 900 + (x % 4) * 60) {
      lv.lavaZones.push({ x1: x, x2: x + 90 });
    }
  }

  // ----- animated decorative props (per-world flavor) -----
  lv.props = [];
  for (let x = 220; x < lv.levelWidth - 220; x += 380 + (x % 5) * 50) {
    const roll = (x % 7);
    if (world.id === 1) {
      if (roll < 3) lv.props.push({ type: 'lantern', x, y: lv.groundY - 130 });
      else if (roll < 5) lv.props.push({ type: 'sign', x, y: lv.groundY - 90 });
      else lv.props.push({ type: 'coin', x, y: lv.groundY - 30, collected: false });
    } else if (world.id === 2) {
      if (roll < 3) lv.props.push({ type: 'campfire', x, y: lv.groundY - 14 });
      else if (roll < 5) lv.props.push({ type: 'coin', x, y: lv.groundY - 30, collected: false });
      else lv.props.push({ type: 'chest', x, y: lv.groundY - 26, collected: false });
    } else {
      if (roll < 3) lv.props.push({ type: 'lantern', x, y: lv.groundY - 110 });
      else if (roll < 5) lv.props.push({ type: 'coin', x, y: lv.groundY - 30, collected: false });
      else lv.props.push({ type: 'chest', x, y: lv.groundY - 26, collected: false });
    }
  }

  if (isBoss) {
    const zlevel = hi + 3;
    lv.zombies.push(makeZombie(bossTypeKeyFor(world), lv.levelWidth - 300, zlevel, lv, true, false));
  } else if (isMini) {
    const zlevel = hi + 1;
    lv.zombies.push(makeZombie(bossTypeKeyFor(world), lv.levelWidth - 340, zlevel, lv, false, true));
    lv.zombies.push(makeZombie(world.roster[0], lv.levelWidth - 520, Math.max(lo, zlevel - 2), lv));
  } else {
    const count = 6 + Math.floor(lv.num / 2);
    for (let i = 0; i < count; i++) {
      const t = world.roster[Math.floor(Math.random() * world.roster.length)];
      const lvl_ = lo + Math.floor(Math.random() * (hi - lo + 1));
      const x = 420 + i * (lv.levelWidth - 700) / count + (Math.random() * 80 - 40);
      lv.zombies.push(makeZombie(t, x, lvl_, lv));
    }
  }
  if (isBoss) lv.survivorRescueX = lv.levelWidth - 100;
}
function bossTypeKeyFor(world) {
  if (world.id === 1) return 'hazmat';
  if (world.id === 2) return 'mutantBear';
  return 'armorMiner';
}
function makeZombie(typeKey, x, zLevel, lv, isBossFlag, isMiniFlag) {
  const t = ZOMBIE_TYPES[typeKey];
  const hpScale = 1 + (zLevel - 1) * 0.32;
  const dmgScale = 1 + (zLevel - 1) * 0.16;
  const maxHp = Math.round(t.baseHp * hpScale * (isBossFlag ? 3.6 : isMiniFlag ? 1.9 : 1));
  return {
    typeKey, def: t, x, y: lv.groundY - t.height,
    width: t.width, height: t.height,
    maxHp, hp: maxHp,
    dmg: Math.round(t.baseDmg * dmgScale),
    level: zLevel,
    speed: t.speed * (isBossFlag ? 0.85 : 1),
    vx: 0, alive: true, facing: -1,
    isBoss: !!isBossFlag, isMini: !!isMiniFlag,
    hitFlashTimer: 0, showHealthBarTimer: 0,
    attackCooldown: 0, rangedCooldown: 0,
    windup: 0, attackState: 'idle',
    coinValue: Math.round((4 + zLevel * 2) * t.coinMult * (isBossFlag ? 6 : isMiniFlag ? 2.5 : 1))
  };
}

function handleGameplayKeydown(e) {
  if (e.code === 'Space' || e.code === 'KeyW') doJump();
  if (e.code === 'KeyJ') doMeleeAttack();
  if (e.code === 'KeyK') fireWeapon('pistol');
  if (e.code === 'KeyL') fireWeapon('grenade');
}
function doJump() {
  if (!level) return;
  if (player.onGround) { player.pvy = -12.5; player.onGround = false; player.jumpCount = 1; Audio.sfxJump(); }
  else if (player.hasDoubleJump && player.jumpCount < player.maxJumps) { player.pvy = -11; player.jumpCount++; Audio.sfxJump(); }
}
function doMeleeAttack() {
  if (state !== GameState.PLAYING || !level) return;
  const now = performance.now();
  if (now - level.lastAttackTime < level.attackCooldown) return;
  level.lastAttackTime = now;
  Audio.sfxSwing();
  const reach = 56;
  const ax = player.px + player.facing * reach / 2 + 24;
  level.slashParticles.push({ x: ax, y: player.py + 20, dir: player.facing, life: 180, born: now });
  applyMeleeDamageArea(ax, player.py + 24, reach, 64, player.facing);
}
function applyMeleeDamageArea(cx, cy, reach, vspan, facing) {
  level.zombies.forEach(z => {
    if (!z.alive) return;
    const dx = (z.x + z.width / 2) - (player.px + 24);
    if (Math.sign(dx || 1) !== facing && Math.abs(dx) > 4) return;
    if (Math.abs(dx) < reach && Math.abs((z.y + z.height/2) - cy) < vspan) {
      dealDamageToZombie(z, computeAttackDamage());
    }
  });
}
function computeAttackDamage() {
  let dmg = player.baseAttack;
  const crit = player.character.id === 'sharpshooter' && Math.random() < 0.15;
  if (crit) dmg *= 1.8;
  dmg = Math.round(dmg * (0.9 + Math.random() * 0.2));
  return { dmg, crit };
}
function dealDamageToZombie(z, dmgInfo) {
  z.hp -= dmgInfo.dmg;
  z.hitFlashTimer = 140;
  z.showHealthBarTimer = 2200;
  Audio.sfxZombieHit();
  level.damageNumbers.push({ x: z.x + z.width/2, y: z.y, text: (dmgInfo.crit ? 'CRIT ' : '') + '-' + dmgInfo.dmg, life: 800, born: performance.now(), crit: dmgInfo.crit });
  if (z.hp <= 0 && z.alive) killZombie(z);
}
function fireWeapon(kind) {
  if (state !== GameState.PLAYING || !level) return;
  if (kind === 'pistol') {
    if (!player.weapons.pistol || player.ammo.pistol <= 0) return;
    const now = performance.now();
    if (now - level.lastBulletTime < level.bulletCooldown) return;
    level.lastBulletTime = now;
    player.ammo.pistol--;
    Audio.sfxGunshot();
    level.bullets.push({ x: player.px + 24, y: player.py + 22, vx: player.facing * 14, dmg: Math.round(player.baseAttack * 0.8) + 6, dir: player.facing });
  } else if (kind === 'grenade') {
    if (!player.weapons.grenade || player.ammo.grenade <= 0) return;
    const now = performance.now();
    if (now - level.lastGrenadeTime < level.grenadeCooldown) return;
    level.lastGrenadeTime = now;
    player.ammo.grenade--;
    // arc throw: initial velocity gives a visible parabolic trajectory (Apple-Knight-style lob)
    level.grenades.push({ x: player.px + 24, y: player.py + 10, vx: player.facing * 7.5, vy: -9.5, dmg: Math.round(player.baseAttack * 1.6) + 20, trail: [] });
  }
}
function updateAmmoRegen(dt) {
  if (player.weapons.pistol && player.ammo.pistol < WEAPON_DEFS.pistol.maxAmmo) {
    player.pistolRegenTimer = (player.pistolRegenTimer || 0) + dt;
    if (player.pistolRegenTimer > WEAPON_DEFS.pistol.regenMs) { player.pistolRegenTimer = 0; player.ammo.pistol++; }
  }
  if (player.weapons.grenade && player.ammo.grenade < WEAPON_DEFS.grenade.maxAmmo) {
    player.grenadeRegenTimer = (player.grenadeRegenTimer || 0) + dt;
    if (player.grenadeRegenTimer > WEAPON_DEFS.grenade.regenMs) { player.grenadeRegenTimer = 0; player.ammo.grenade++; }
  }
}
function spawnExplosion(x, y, radius, dmg, friendly) {
  level.explosions.push({ x, y, radius, life: 380, born: performance.now(), maxRadius: radius });
  Audio.sfxExplosion();
  if (friendly) {
    level.zombies.forEach(z => {
      if (!z.alive) return;
      const d = Math.hypot((z.x + z.width/2) - x, (z.y + z.height/2) - y);
      if (d < radius) dealDamageToZombie(z, { dmg: Math.round(dmg * (1 - d / radius * 0.5)), crit: false });
    });
  } else {
    const d = Math.hypot((player.px + 24) - x, (player.py + 24) - y);
    if (d < radius) applyDamageToPlayer(Math.round(dmg * (1 - d / radius * 0.5)));
  }
}
function killZombie(z) {
  z.alive = false;
  player.zombiesSlain++;
  level.zombiesSlainThisLevel++;
  let coins = z.coinValue;
  if (player.character.id === 'scavenger') coins = Math.round(coins * 1.2);
  player.coins += coins; player.lifetimeCoins += coins; level.coinsThisLevel += coins;
  Audio.sfxCoin();
  if (z.isBoss && level.def.type === 'boss') onBossDefeated();
}
function applyDamageToPlayer(amount) {
  const dmgTaken = Math.max(1, Math.round(amount - player.armor));
  player.health -= dmgTaken;
  Audio.sfxPlayerHurt();
  level.damageNumbers.push({ x: player.px + 24, y: player.py, text: '-' + dmgTaken, life: 800, born: performance.now(), playerHit: true });
  if (player.health <= 0) { player.health = 0; onPlayerDeath(); }
}

function isInView(x, w) {
  return x + w > level.camX - CAMERA_BUFFER && x < level.camX + W + CAMERA_BUFFER;
}
function updateGameplay(dt) {
  if (!level) return;
  const lv = level;
  const speed = player.baseSpeed;
  let moveX = 0;
  if (keys['ArrowRight'] || keys['KeyD'] || touchState.right) { moveX = 1; player.facing = 1; }
  if (keys['ArrowLeft'] || keys['KeyA'] || touchState.left) { moveX = -1; player.facing = -1; }
  player.pvx = moveX * speed;

  if (player.character.id === 'medic') {
    player.regenTimer += dt;
    if (player.regenTimer > 2500) { player.regenTimer = 0; player.health = Math.min(player.maxHealth, player.health + 2); }
  }
  updateAmmoRegen(dt);

  let nextX = player.px + player.pvx;
  nextX = Math.max(0, Math.min(lv.levelWidth - 48, nextX));
  const px1 = nextX, px2 = nextX + 48;
  let blockedX = false;
  lv.terrain.forEach(o => {
    if (o.type === 'spike' || o.broken) return;
    if (px2 > o.x && px1 < o.x + o.w && player.py + 48 > o.y && player.py < o.y + o.h) blockedX = true;
  });
  if (!blockedX) player.px = nextX;

  player.pvy += 0.55;
  if (player.pvy > 16) player.pvy = 16;
  let nextY = player.py + player.pvy;
  const inGap = lv.groundGaps.some(g => player.px + 24 > g.x1 && player.px + 24 < g.x2);
  const floorY = lv.groundY - 48;
  player.onGround = false;
  if (!inGap && nextY >= floorY) {
    nextY = floorY; player.pvy = 0; player.onGround = true; player.jumpCount = 0;
  } else {
    lv.terrain.forEach(o => {
      if (o.broken) return;
      const solidTop = (o.type === 'crate' || o.type === 'platform' || o.type === 'crumble');
      if (!solidTop) return;
      const willOverlapX = (player.px + 48 > o.x && player.px < o.x + o.w);
      if (willOverlapX && player.pvy >= 0 && player.py + 48 <= o.y + 2 && nextY + 48 >= o.y) {
        nextY = o.y - 48; player.pvy = 0; player.onGround = true; player.jumpCount = 0;
        if (o.type === 'crumble') { o.standTimer = (o.standTimer || 0) + dt; }
      }
    });
  }
  player.py = nextY;
  if (player.onGround && !inGap) { lv.lastSafeX = player.px; lv.lastSafeY = player.py; }

  if (player.py > H + 40) {
    applyDamageToPlayer(18);
    player.px = lv.lastSafeX; player.py = lv.lastSafeY; player.pvy = 0; player.onGround = true;
  }

  lv.spikeCooldown -= dt;
  lv.terrain.forEach(o => {
    if (o.type !== 'spike') return;
    if (player.px + 44 > o.x && player.px + 4 < o.x + o.w && player.py + 48 > o.y && lv.spikeCooldown <= 0) {
      applyDamageToPlayer(10); lv.spikeCooldown = 700;
    }
  });
  lv.lavaTickTimer -= dt;
  lv.lavaZones.forEach(zone => {
    if (player.px + 24 > zone.x1 && player.px + 24 < zone.x2 && player.onGround && lv.lavaTickTimer <= 0) {
      applyDamageToPlayer(6); lv.lavaTickTimer = 500;
    }
  });
  lv.terrain.forEach(o => {
    if (o.type !== 'crumble') return;
    if (!o.broken && o.standTimer > 550) { o.broken = true; o.respawnAt = performance.now() + 3000; o.standTimer = 0; }
    if (o.broken && performance.now() > o.respawnAt) o.broken = false;
    if (!(player.px + 48 > o.x && player.px < o.x + o.w && Math.abs((player.py + 48) - o.y) < 4)) {
      if (o.standTimer > 0) o.standTimer = Math.max(0, o.standTimer - dt * 2);
    }
  });
  lv.props.forEach(p => {
    if ((p.type !== 'coin' && p.type !== 'chest') || p.collected) return;
    if (Math.abs((player.px + 24) - p.x) < 28 && Math.abs((player.py + 24) - p.y) < 36) {
      p.collected = true;
      const bonus = p.type === 'chest' ? 25 : 5;
      player.coins += bonus; player.lifetimeCoins += bonus; level.coinsThisLevel += bonus;
      Audio.sfxCoin();
    }
  });
  if (lv.world.hazardSet.includes('stalactite')) {
    lv.stalactiteTimer -= dt;
    if (lv.stalactiteTimer <= 0) {
      lv.stalactiteTimer = 1400 + Math.random() * 1200;
      const sx = lv.camX + 80 + Math.random() * (W - 160);
      lv.enemyProjectiles.push({ x: sx, y: -20, vx: 0, vy: 2, dmg: 16, type: 'stalactite', w: 14, h: 24 });
    }
  }

  lv.camX = Math.max(0, Math.min(lv.levelWidth - W, player.px - W / 2));

  lv.zombies.forEach(z => {
    if (!z.alive) return;
    if (!isInView(z.x, z.width)) return;
    z.hitFlashTimer = Math.max(0, z.hitFlashTimer - dt);
    z.showHealthBarTimer = Math.max(0, z.showHealthBarTimer - dt);
    const dx = (player.px + 24) - (z.x + z.width / 2);
    const dist = Math.abs(dx);
    z.facing = dx > 0 ? 1 : -1;

    if (z.isBoss || z.isMini) { updateBossBehavior(z, dx, dist, dt); return; }

    if (z.def.ranged) {
      if (dist < 520) {
        z.rangedCooldown -= dt;
        if (dist > 140) z.x += Math.sign(dx) * z.speed;
        if (z.rangedCooldown <= 0 && dist < 500) {
          z.rangedCooldown = 1600;
          const sp = 5;
          const ang = Math.atan2((player.py + 24) - (z.y + 16), dx);
          lv.enemyProjectiles.push({ x: z.x + z.width/2, y: z.y + 16, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, dmg: z.dmg, type: 'spore', w: 10, h: 10 });
        }
      }
      return;
    }
    if (dist < 480) {
      if (dist > 40) { z.x += Math.sign(dx) * z.speed; }
      else {
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) { z.attackCooldown = 900; applyDamageToPlayer(z.dmg); }
      }
    }
  });

  for (let i = lv.bullets.length - 1; i >= 0; i--) {
    const b = lv.bullets[i];
    b.x += b.vx;
    let hit = false;
    lv.zombies.forEach(z => {
      if (!z.alive || hit) return;
      if (b.x > z.x && b.x < z.x + z.width && Math.abs((z.y + z.height/2) - b.y) < z.height/2 + 6) {
        dealDamageToZombie(z, { dmg: b.dmg, crit: false });
        hit = true;
      }
    });
    if (hit || b.x < lv.camX - 60 || b.x > lv.camX + W + 60) lv.bullets.splice(i, 1);
  }
  for (let i = lv.grenades.length - 1; i >= 0; i--) {
    const g = lv.grenades[i];
    g.vy += 0.5; g.x += g.vx; g.y += g.vy;
    if (g.trail) { g.trail.push({ x: g.x, y: g.y }); if (g.trail.length > 10) g.trail.shift(); }
    if (g.y >= lv.groundY - 10) { spawnExplosion(g.x, lv.groundY - 10, 110, g.dmg, true); lv.grenades.splice(i, 1); continue; }
    let hitZombie = false;
    lv.zombies.forEach(z => {
      if (!z.alive || hitZombie) return;
      if (g.x > z.x && g.x < z.x + z.width && g.y > z.y && g.y < z.y + z.height) hitZombie = true;
    });
    if (hitZombie) { spawnExplosion(g.x, g.y, 110, g.dmg, true); lv.grenades.splice(i, 1); }
  }
  for (let i = lv.enemyProjectiles.length - 1; i >= 0; i--) {
    const p = lv.enemyProjectiles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'stalactite') p.vy += 0.15;
    const hitPlayer = Math.abs(p.x - (player.px + 24)) < 22 && Math.abs(p.y - (player.py + 24)) < 26;
    if (hitPlayer) { applyDamageToPlayer(p.dmg); lv.enemyProjectiles.splice(i, 1); continue; }
    if (p.y > lv.groundY + 20 || p.x < lv.camX - 100 || p.x > lv.camX + W + 100) lv.enemyProjectiles.splice(i, 1);
  }
  const now = performance.now();
  for (let i = lv.explosions.length - 1; i >= 0; i--) if (now - lv.explosions[i].born > lv.explosions[i].life) lv.explosions.splice(i, 1);
  for (let i = lv.damageNumbers.length - 1; i >= 0; i--) if (now - lv.damageNumbers[i].born > lv.damageNumbers[i].life) lv.damageNumbers.splice(i, 1);
  for (let i = lv.slashParticles.length - 1; i >= 0; i--) if (now - lv.slashParticles[i].born > lv.slashParticles[i].life) lv.slashParticles.splice(i, 1);

  if (lv.survivorRescueX && !lv.survivorRescued && lv.bossCleared) {
    if (Math.abs(player.px - lv.survivorRescueX) < 40 && keys['KeyE']) { lv.survivorRescued = true; lv.survivorsSavedThisLevel = 1; }
  }

  if (player.px > lv.levelWidth - 90) {
    if (lv.def.type === 'boss') { if (lv.bossCleared && lv.survivorRescued) finishLevel(); }
    else if (lv.def.type === 'miniboss') { if (!lv.zombies.some(z => z.isMini && z.alive)) finishLevel(); }
    else finishLevel();
  }
}
function updateBossBehavior(z, dx, dist, dt) {
  z.attackState = z.attackState || 'idle';
  z.windup = z.windup || 0;
  if (dist < 600 && z.attackState === 'idle') {
    if (dist > 70) { z.x += Math.sign(dx) * z.speed; }
    else { z.attackState = 'windup'; z.windup = 0; }
  } else if (z.attackState === 'windup') {
    z.windup += dt;
    if (z.windup > 700) { z.attackState = 'attack'; z.windup = 0; }
  } else if (z.attackState === 'attack') {
    if (Math.abs(dx) < 90) applyDamageToPlayer(z.dmg);
    z.attackState = 'cooldown'; z.windup = 0;
  } else if (z.attackState === 'cooldown') {
    z.windup += dt;
    if (z.windup > 900) { z.attackState = 'idle'; z.windup = 0; }
    if (dist > 90) { z.x += Math.sign(dx) * z.speed * 0.6; }
  }
}
function onBossDefeated() { level.bossCleared = true; }
function onPlayerDeath() { setState(GameState.GAME_OVER); }

function finishLevel() {
  level.def.cleared = true;
  const wi = player.currentWorld;
  if (level.num >= player.furthestLevelByWorld[wi]) player.furthestLevelByWorld[wi] = Math.min(10, level.num + 1);
  const body = document.getElementById('summaryBody');
  body.innerHTML = `
    <div class="summary-row"><span>Zombies Slain</span><span>${level.zombiesSlainThisLevel}</span></div>
    <div class="summary-row"><span>Bonus Coins (by level)</span><span>${level.coinsThisLevel}</span></div>
    <div class="summary-row"><span>Survivors Saved</span><span>${level.survivorsSavedThisLevel}</span></div>
    <div class="summary-row"><span><strong>Total Coins Awarded</strong></span><span><strong>${level.coinsThisLevel}</strong></span></div>`;
  document.getElementById('summaryTitle').textContent = 'LEVEL ' + level.num + ' COMPLETE';

  if (level.def.type === 'boss') {
    if (level.num === 10 && wi < WORLDS.length - 1 && !player.unlockedWorlds.includes(wi + 1)) {
      player.unlockedWorlds.push(wi + 1);
    }
    setState(GameState.BOSS_CLEAR);
    document.getElementById('bossClearBody').innerHTML =
      `The rescued survivor steps forward, offering their last piece of gear before collapsing with relief.<br><br>
       "${player.name}, take this. You'll need it out there."<br><br>
       <strong style="color:#e8d060;">You unlocked: ${level.world.rewardName}!</strong>`;
    if (!player.unlockedAbilities.includes(level.world.rewardName)) player.unlockedAbilities.push(level.world.rewardName);
    if (level.world.rewardAbility === 'doubleJump') player.hasDoubleJump = true;
    if (level.world.rewardAbility === 'wallJump') player.upgrades.armor = Math.min(UPGRADE_DEFS.armor.max, player.upgrades.armor + 1);
    recomputePlayerStats();
    saveGame();
  } else {
    saveGame();
    setState(GameState.SUMMARY);
  }
}
document.getElementById('summaryContinueBtn').addEventListener('click', () => { level = null; enterOverworld(); });
document.getElementById('bossClearContinueBtn').addEventListener('click', () => { level = null; enterRegionMap(); });
document.getElementById('retryBtn').addEventListener('click', () => { startLevel(level.num); });
document.getElementById('toOverworldBtn').addEventListener('click', () => { level = null; enterOverworld(); });

/* =====================================================================
   GAMEPLAY RENDERING
===================================================================== */
function drawGameplay() {
  const lv = level;
  ctx.save();
  ctx.fillStyle = lv.world.bgColor; ctx.fillRect(0, 0, W, H);
  drawCityBackdrop(lv.camX, lv.world.id);

  ctx.translate(-lv.camX, 0);

  ctx.fillStyle = lv.world.groundColor;
  let cursor = 0;
  const sortedGaps = lv.groundGaps.slice().sort((a,b) => a.x1 - b.x1);
  sortedGaps.forEach(g => {
    if (g.x2 < lv.camX - CAMERA_BUFFER || g.x1 > lv.camX + W + CAMERA_BUFFER) return;
    ctx.fillRect(cursor, lv.groundY + 48, g.x1 - cursor, H - lv.groundY - 48);
    cursor = g.x2;
  });
  ctx.fillRect(cursor, lv.groundY + 48, lv.levelWidth - cursor, H - lv.groundY - 48);
  // textured ground top (grass tufts for forest, gravel dashes for city/caves)
  const isGrassy = lv.world.hazardSet.includes('pit') || lv.world.hazardSet.includes('crumble');
  ctx.fillStyle = isGrassy ? '#6a9a4a' : '#54545c';
  ctx.fillRect(Math.max(0, lv.camX - CAMERA_BUFFER), lv.groundY + 48, W + CAMERA_BUFFER * 2, 4);
  if (isGrassy) {
    ctx.fillStyle = '#7fae5a';
    for (let gx = Math.floor((lv.camX - CAMERA_BUFFER) / 14) * 14; gx < lv.camX + W + CAMERA_BUFFER; gx += 14) {
      ctx.fillRect(gx, lv.groundY + 44, 3, 6); ctx.fillRect(gx + 6, lv.groundY + 46, 3, 4);
    }
  } else {
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (let gx = Math.floor((lv.camX - CAMERA_BUFFER) / 40) * 40; gx < lv.camX + W + CAMERA_BUFFER; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx, lv.groundY + 52); ctx.lineTo(gx + 20, lv.groundY + 52); ctx.stroke();
    }
  }
  ctx.fillStyle = '#000';
  sortedGaps.forEach(g => { if (isInView(g.x1, g.x2 - g.x1)) ctx.fillRect(g.x1, lv.groundY + 40, g.x2 - g.x1, H); });

  ctx.fillStyle = '#c9541f';
  lv.lavaZones.forEach(z => { if (isInView(z.x1, z.x2 - z.x1)) ctx.fillRect(z.x1, lv.groundY + 40, z.x2 - z.x1, 10); });

  lv.terrain.forEach(o => {
    if (!isInView(o.x, o.w)) return;
    if (o.type === 'crate') {
      ctx.fillStyle = '#6b5030'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(o.x, o.y, o.w, 4); // top highlight
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(o.x, o.y + o.h - 5, o.w, 5); // under-shadow
      ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 2.5; ctx.strokeRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h); ctx.stroke();
    }
    else if (o.type === 'platform') {
      ctx.fillStyle = '#4a6b3a'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(o.x, o.y, o.w, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(o.x, o.y + o.h - 4, o.w, 4);
      ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
    }
    else if (o.type === 'spike') {
      ctx.fillStyle = '#c8c8d0';
      for (let sx = o.x; sx < o.x + o.w; sx += 8) {
        ctx.beginPath(); ctx.moveTo(sx, o.y + o.h); ctx.lineTo(sx + 4, o.y); ctx.lineTo(sx + 8, o.y + o.h); ctx.closePath();
        ctx.fill(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    else if (o.type === 'crumble' && !o.broken) {
      ctx.fillStyle = o.standTimer > 300 ? '#8a6a4a' : '#5a4530'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(o.x, o.y, o.w, 3);
      ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 2; ctx.strokeRect(o.x, o.y, o.w, o.h);
    }
  });

  if (lv.survivorRescueX && lv.bossCleared && !lv.survivorRescued) {
    ctx.fillStyle = '#8fd0ff'; ctx.fillRect(lv.survivorRescueX - 8, lv.groundY - 40, 16, 40);
    ctx.fillStyle = '#fff'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('Press E to Rescue', lv.survivorRescueX, lv.groundY - 50);
  }

  lv.props.forEach(p => { if (isInView(p.x, 30)) drawProp(p); });

  lv.zombies.forEach(z => { if (isInView(z.x, z.width)) drawZombie(z); });

  lv.enemyProjectiles.forEach(p => {
    ctx.fillStyle = p.type === 'stalactite' ? '#8a8a90' : '#9fd050';
    if (p.type === 'stalactite') ctx.fillRect(p.x - p.w/2, p.y, p.w, p.h);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill(); }
  });
  ctx.fillStyle = '#ffe08a';
  lv.bullets.forEach(b => ctx.fillRect(b.x - 6, b.y - 2, 12, 3));
  lv.grenades.forEach(g => {
    if (g.trail && g.trail.length > 1) {
      ctx.strokeStyle = 'rgba(255,220,150,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(g.trail[0].x, g.trail[0].y);
      g.trail.forEach(pt => ctx.lineTo(pt.x, pt.y));
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = '#2f3a26'; ctx.beginPath(); ctx.arc(g.x, g.y, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#c9541f'; ctx.fillRect(g.x - 1, g.y - 8, 2, 4);
  });
  lv.explosions.forEach(ex => {
    const age = (performance.now() - ex.born) / ex.life;
    ctx.globalAlpha = Math.max(0, 1 - age);
    ctx.fillStyle = '#ffae40';
    ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.maxRadius * age, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  lv.slashParticles.forEach(p => {
    const age = (performance.now() - p.born) / p.life;
    const sweep = Math.min(1, age * 2.2); // fast outward sweep, then fade
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - age);
    const startA = p.dir > 0 ? -1.3 : Math.PI - 0.35;
    const endA = p.dir > 0 ? -1.3 + 1.75 * sweep : (Math.PI - 0.35) + 1.75 * sweep;
    // filled crescent (two arcs of different radius forming a blade trail)
    ctx.beginPath();
    ctx.arc(p.x, p.y, 40, startA, endA, p.dir < 0);
    ctx.arc(p.x, p.y, 26, endA, startA, p.dir >= 0);
    ctx.closePath();
    const grad = ctx.createRadialGradient(p.x, p.y, 20, p.x, p.y, 42);
    grad.addColorStop(0, 'rgba(255,255,255,0.05)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0.75)');
    grad.addColorStop(1, 'rgba(255,255,255,0.15)');
    ctx.fillStyle = grad;
    ctx.fill();
    // crisp bright leading edge line
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 40, startA, endA, p.dir < 0); ctx.stroke();
    ctx.restore();
  });

  drawPlayerCharacter();

  lv.damageNumbers.forEach(d => {
    const age = (performance.now() - d.born) / d.life;
    ctx.globalAlpha = Math.max(0, 1 - age);
    ctx.fillStyle = d.playerHit ? '#ff5050' : (d.crit ? '#ffcf40' : '#fff');
    ctx.font = (d.crit ? 'bold 16px' : '13px') + ' Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(d.text, d.x, d.y - 20 - age * 30);
    ctx.globalAlpha = 1;
  });

  ctx.restore();

  if (lv.world.darkness) drawDarknessOverlay();

  drawGameplayHUD();
}
function drawDarknessOverlay() {
  const screenPX = player.px - level.camX + 24, screenPY = player.py + 24;
  const grad = ctx.createRadialGradient(screenPX, screenPY, 40, screenPX, screenPY, 240);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.55)');
  grad.addColorStop(1, 'rgba(0,0,0,0.92)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}
function drawProp(p) {
  const t = performance.now();
  if (p.type === 'lantern') {
    const sway = Math.sin(t / 500 + p.x) * 6;
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x + sway, p.y + 10); ctx.stroke();
    const glow = 0.6 + 0.4 * Math.sin(t / 300 + p.x);
    ctx.fillStyle = `rgba(232,208,96,${glow})`;
    ctx.beginPath(); ctx.arc(p.x + sway, p.y + 18, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (p.type === 'sign') {
    const sway = Math.sin(t / 600 + p.x) * 4;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(sway * 0.02);
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 0); ctx.stroke();
    ctx.fillStyle = '#5a4a38'; ctx.fillRect(-18, -20, 36, 16);
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 2; ctx.strokeRect(-18, -20, 36, 16);
    ctx.restore();
  } else if (p.type === 'campfire') {
    const flick = 0.7 + 0.3 * Math.sin(t / 90 + p.x);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(p.x - 12, p.y, 8, 6); ctx.fillRect(p.x + 4, p.y, 8, 6);
    ctx.fillStyle = `rgba(255,140,40,${flick})`;
    ctx.beginPath(); ctx.moveTo(p.x - 6, p.y); ctx.lineTo(p.x, p.y - 22 * flick); ctx.lineTo(p.x + 6, p.y); ctx.fill();
    ctx.fillStyle = `rgba(255,220,100,${flick})`;
    ctx.beginPath(); ctx.moveTo(p.x - 3, p.y); ctx.lineTo(p.x, p.y - 12 * flick); ctx.lineTo(p.x + 3, p.y); ctx.fill();
  } else if (p.type === 'coin' && !p.collected) {
    const bob = Math.sin(t / 250 + p.x) * 4;
    ctx.fillStyle = '#e8d060';
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8a6a1a'; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (p.type === 'chest' && !p.collected) {
    ctx.fillStyle = '#6b4a28'; ctx.fillRect(p.x - 14, p.y, 28, 18);
    ctx.fillStyle = '#4a3018'; ctx.fillRect(p.x - 14, p.y, 28, 7);
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 2; ctx.strokeRect(p.x - 14, p.y, 28, 18);
    ctx.fillStyle = '#e8d060'; ctx.fillRect(p.x - 3, p.y + 6, 6, 6);
  }
}
function drawCityBackdrop(camX, worldId) {
  const t = performance.now();
  if (worldId === 1) {
    // far silhouette skyline
    ctx.save(); ctx.translate(-camX * 0.15, 0);
    ctx.fillStyle = '#141826';
    for (let i = -1; i < 40; i++) {
      const bh = 140 + ((i * 71) % 180);
      ctx.fillRect(i * 110 + 10, 300 - bh, 80, bh);
    }
    ctx.restore();
    // midground dilapidated brick buildings
    ctx.save(); ctx.translate(-camX * 0.35, 0);
    ctx.fillStyle = 'rgba(120,90,80,0.15)';
    for (let i = -1; i < 40; i++) {
      const bh = 180 + ((i * 53) % 160);
      ctx.fillRect(i * 150 + 20, 340 - bh, 96, bh);
      ctx.fillStyle = 'rgba(232,192,74,0.08)';
      for (let wy = 340 - bh + 14; wy < 320; wy += 22) for (let wx = i*150+30; wx < i*150+100; wx += 20) ctx.fillRect(wx, wy, 8, 10);
      ctx.fillStyle = 'rgba(120,90,80,0.15)';
    }
    ctx.restore();
  } else if (worldId === 2) {
    // soft glow rays through canopy (far layer)
    ctx.save();
    const grad = ctx.createLinearGradient(0, 0, 0, 400);
    grad.addColorStop(0, 'rgba(200,220,120,0.08)'); grad.addColorStop(1, 'rgba(200,220,120,0)');
    ctx.fillStyle = grad;
    for (let i = 0; i < 6; i++) {
      const rx = ((i * 220 - camX * 0.08) % (W + 300)) - 100;
      ctx.save(); ctx.translate(rx, 0); ctx.rotate(0.25);
      ctx.fillRect(0, -50, 40, 500);
      ctx.restore();
    }
    ctx.restore();
    // dense pine layers (two depths)
    ctx.save(); ctx.translate(-camX * 0.2, 0);
    ctx.fillStyle = '#152417';
    for (let i = -1; i < 50; i++) drawPine(i * 90 + 10, 340, 60, 140);
    ctx.restore();
    ctx.save(); ctx.translate(-camX * 0.4, 0);
    ctx.fillStyle = '#1c3320';
    for (let i = -1; i < 50; i++) drawPine(i * 130 + 60, 350, 80, 170);
    ctx.restore();
    // floating spore/leaf particles
    ctx.fillStyle = 'rgba(210,230,140,0.5)';
    for (let i = 0; i < 26; i++) {
      const px = ((i * 137 + t * 0.02) % (W + 40)) - 20;
      const py = ((i * 71 + t * 0.015) % 420);
      ctx.fillRect(px, py, 3, 3);
    }
  } else if (worldId === 3) {
    // jagged cavern silhouette + glowing mineral veins
    ctx.save(); ctx.translate(-camX * 0.2, 0);
    ctx.fillStyle = '#151212';
    for (let i = -1; i < 50; i++) {
      const h = 160 + ((i * 61) % 140);
      ctx.beginPath();
      ctx.moveTo(i * 100, 400);
      ctx.lineTo(i * 100 + 50, 400 - h);
      ctx.lineTo(i * 100 + 100, 400);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // glowing mineral veins (pulsing)
    const pulse = 0.5 + 0.5 * Math.sin(t / 700);
    ctx.save(); ctx.translate(-camX * 0.3, 0);
    ctx.strokeStyle = `rgba(120,200,255,${0.15 + pulse * 0.15})`; ctx.lineWidth = 3;
    for (let i = 0; i < 40; i++) {
      const vx = i * 180 + 40, vy = 150 + (i % 3) * 90;
      ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx + 40, vy + 30); ctx.lineTo(vx + 20, vy + 70); ctx.stroke();
    }
    ctx.restore();
    // dripping water particles
    ctx.fillStyle = 'rgba(140,190,220,0.6)';
    for (let i = 0; i < 18; i++) {
      const px = (i * 211) % (W);
      const py = (t * 0.12 + i * 53) % 420;
      ctx.fillRect(px, py, 2, 6);
    }
  }
}
function drawPine(x, groundY, w, h) {
  ctx.beginPath();
  ctx.moveTo(x, groundY);
  ctx.lineTo(x + w/2, groundY - h);
  ctx.lineTo(x + w, groundY);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(x + w/2 - 5, groundY - 14, 10, 14);
}
function drawZombie(z) {
  if (!z.alive) return;
  const flashing = z.hitFlashTimer > 0;
  let bodyColor = flashing ? '#ffffff' : z.def.color;
  const isWindup = (z.isBoss || z.isMini) && z.attackState === 'windup';
  if (isWindup) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 60);
    bodyColor = flashing ? '#fff' : `rgba(199,56,56,${0.5 + pulse * 0.5})`;
  }
  ctx.save();
  if (isWindup) { ctx.shadowColor = '#ff3030'; ctx.shadowBlur = 14; }
  // thick black outline silhouette behind body
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(z.x - 2, z.y - 2, z.width + 4, z.height + 4);
  ctx.fillStyle = bodyColor;
  ctx.fillRect(z.x, z.y, z.width, z.height);
  ctx.restore();
  // armor/detail accents per type
  if (z.typeKey === 'hazmat' || z.typeKey === 'armorMiner') {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(z.x + 4, z.y + z.height * 0.35, z.width - 8, z.height * 0.3);
  }
  // head + eyes
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(z.x + z.width/2 - 8, z.y - 6, 16, 12);
  ctx.fillStyle = flashing ? '#fff' : '#7a8a5a'; ctx.fillRect(z.x + z.width/2 - 6, z.y - 4, 12, 10);
  ctx.fillStyle = '#c73838';
  const eyeGlow = z.def.ranged ? '#8fd070' : '#c73838';
  ctx.fillStyle = eyeGlow;
  ctx.fillRect(z.x + z.width/2 - 4, z.y - 1, 3, 3); ctx.fillRect(z.x + z.width/2 + 1, z.y - 1, 3, 3);

  ctx.fillStyle = '#000000aa';
  ctx.fillRect(z.x + z.width/2 - 16, z.y - 34, 32, 14);
  ctx.fillStyle = z.isBoss ? '#ff6060' : z.isMini ? '#ffcf60' : '#cfe0ff';
  ctx.font = '10px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('Lv.' + z.level, z.x + z.width/2, z.y - 24);

  if (!z.isBoss && !z.isMini && z.showHealthBarTimer > 0) {
    const barW = z.width + 10;
    ctx.fillStyle = '#222'; ctx.fillRect(z.x - 5, z.y - 18, barW, 6);
    ctx.fillStyle = '#5fbf4a'; ctx.fillRect(z.x - 5, z.y - 18, barW * Math.max(0, z.hp / z.maxHp), 6);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(z.x - 5, z.y - 18, barW, 6);
  }
}
function drawPlayerCharacter() {
  const c = player.character;
  const bob = player.onGround ? 0 : Math.sin(performance.now() / 90) * 2;
  ctx.save();
  if (player.facing < 0) { ctx.translate(player.px + 24, 0); ctx.scale(-1, 1); ctx.translate(-(player.px + 24), 0); }

  // thick black outline silhouette
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(player.px + 6, player.py + 12 + bob, 36, 30);
  ctx.fillRect(player.px + 10, player.py - 2 + bob, 28, 22);

  // hooded cloak body
  ctx.fillStyle = c.color;
  ctx.fillRect(player.px + 8, player.py + 14 + bob, 32, 26);
  // hood/head
  ctx.fillStyle = '#e0c8a0';
  ctx.fillRect(player.px + 12, player.py + bob, 24, 18);
  ctx.fillStyle = shadeColor(c.color, -30);
  ctx.fillRect(player.px + 10, player.py - 2 + bob, 28, 8); // hood brim
  // expressive eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(player.px + 26, player.py + 8 + bob, 3, 4);
  ctx.fillRect(player.px + 32, player.py + 8 + bob, 3, 4);
  // legs
  ctx.fillStyle = '#2a2a30';
  ctx.fillRect(player.px + 10, player.py + 40 + bob, 12, 8);
  ctx.fillRect(player.px + 26, player.py + 40 + bob, 12, 8);
  // weapon prop (sword hilt visible at side, forward hand)
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(player.px + 40, player.py + 22 + bob); ctx.lineTo(player.px + 52, player.py + 10 + bob); ctx.stroke();
  ctx.strokeStyle = '#d8d8e0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(player.px + 40, player.py + 22 + bob); ctx.lineTo(player.px + 52, player.py + 10 + bob); ctx.stroke();

  ctx.restore();
}
function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + percent, g = ((num >> 8) & 0xff) + percent, b = (num & 0xff) + percent;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}
function drawGameplayHUD() {
  ctx.fillStyle = '#000a'; ctx.fillRect(10, 10, 210, 22);
  ctx.fillStyle = '#c73838';
  ctx.fillRect(13, 13, 204 * Math.max(0, player.health / player.maxHealth), 16);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(10, 10, 210, 22);
  ctx.fillStyle = '#fff'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
  ctx.fillText(Math.max(0, Math.round(player.health)) + ' / ' + player.maxHealth, 16, 26);

  ctx.font = '13px Courier New';
  ctx.fillText('Coins: ' + player.coins, 10, 52);
  ctx.fillText(level.world.name + ' - Level ' + level.num, 10, 70);

  const bossZ = level.zombies.find(z => (z.isBoss || z.isMini) && z.alive);
  if (bossZ) {
    const info = bossZ.isBoss ? level.world.bossInfo : level.world.miniBossInfo;
    const barW = 420;
    ctx.textAlign = 'center';
    ctx.fillStyle = bossZ.isBoss ? '#ff8080' : '#ffcf80';
    ctx.font = 'bold 15px Courier New';
    ctx.fillText(info.name + ' \u2014 ' + info.title, W/2, 24);
    ctx.fillStyle = '#000a'; ctx.fillRect(W/2 - barW/2, 30, barW, 14);
    ctx.fillStyle = bossZ.isBoss ? '#c73838' : '#c98f20';
    ctx.fillRect(W/2 - barW/2 + 2, 32, (barW - 4) * Math.max(0, bossZ.hp / bossZ.maxHp), 10);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(W/2 - barW/2, 30, barW, 14);
  }

  ctx.textAlign = 'right'; ctx.font = '11px Courier New'; ctx.fillStyle = '#cfcfd8';
  let controls = 'A/D move | Space/W jump' + (player.hasDoubleJump ? ' (x2)' : '') + ' | J/Click slash';
  if (player.weapons.pistol) controls += ' | K/RClick gun (' + player.ammo.pistol + ')';
  if (player.weapons.grenade) controls += ' | L bomb (' + player.ammo.grenade + ')';
  ctx.fillText(controls, W - 10, H - 10);

  // sync ammo counts onto touch buttons
  if (player.weapons.pistol) document.getElementById('tBtnPistol').textContent = 'GUN ' + player.ammo.pistol;
  if (player.weapons.grenade) document.getElementById('tBtnGrenade').textContent = 'BOMB ' + player.ammo.grenade;
}

/* =====================================================================
   MASTER LOOP
===================================================================== */
let lastTime = performance.now();
function masterLoop(now) {
  const dt = Math.min(40, now - lastTime);
  lastTime = now;
  switch (state) {
    case GameState.CINEMATIC: runCinematic(now); break;
    case GameState.OVERWORLD: updateOverworldMovement(); drawOverworld(); break;
    case GameState.PLAYING: updateGameplay(dt); drawGameplay(); break;
    default:
      ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H);
      break;
  }
  requestAnimationFrame(masterLoop);
}

/* =====================================================================
   BOOT: resume save if present, otherwise start from cinematic
===================================================================== */
(function boot() {
  const hasSave = loadGame();
  if (hasSave) {
    document.getElementById('tBtnPistol').classList.toggle('hidden', !player.weapons.pistol);
    document.getElementById('tBtnGrenade').classList.toggle('hidden', !player.weapons.grenade);
    enterRegionMap();
  } else {
    setState(GameState.CINEMATIC);
    cinematicStart = performance.now();
  }
  requestAnimationFrame(masterLoop);
})();
</script>
