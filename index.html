<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEADWALK: World 1 - The City</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a0f; overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 960px; height: 600px;
    margin: 0 auto;
    top: 50%; transform: translateY(-50%);
    box-shadow: 0 0 0 4px #1a1a24, 0 0 40px rgba(0,0,0,0.8);
    background: #000;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #111;
  }
  .overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #d7d7de; z-index: 10;
  }
  .hidden { display: none !important; }
  .pixel-panel {
    background: #16161d;
    border: 4px solid #3a3a4a;
    box-shadow: inset 0 0 0 2px #0a0a0f;
    padding: 20px 28px;
    image-rendering: pixelated;
  }
  .title-text {
    font-size: 42px; letter-spacing: 4px; color: #c73838;
    text-shadow: 3px 3px 0 #000, 0 0 20px rgba(199,56,56,0.5);
    margin-bottom: 6px;
  }
  .subtitle-text { font-size: 14px; color: #7a7a8a; letter-spacing: 3px; margin-bottom: 30px; }
  button.pixel-btn {
    font-family: 'Courier New', monospace;
    background: #2a2a38; color: #e0e0e8;
    border: 3px solid #4a4a5e;
    padding: 10px 22px; font-size: 15px; letter-spacing: 1px;
    cursor: pointer; margin: 6px;
    box-shadow: 3px 3px 0 #000;
    transition: transform 0.05s;
  }
  button.pixel-btn:hover { background: #3a3a4e; border-color: #6a6a80; }
  button.pixel-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  button.pixel-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  button.pixel-btn.accent { background: #7a2020; border-color: #c73838; }
  button.pixel-btn.accent:hover { background: #932828; }
  input.name-input {
    font-family: 'Courier New', monospace;
    background: #0d0d13; color: #e8d060;
    border: 3px solid #4a4a5e; padding: 10px 14px;
    font-size: 18px; letter-spacing: 2px; width: 300px; text-align: center;
  }
  input.name-input:focus { outline: none; border-color: #e8d060; }
  #skipBtn {
    position: absolute; top: 16px; right: 16px; z-index: 20;
  }
  .char-select-row { display: flex; gap: 14px; margin: 18px 0; }
  .char-card {
    width: 130px; padding: 10px 8px; background: #1c1c26;
    border: 3px solid #3a3a4a; text-align: center; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .char-card.selected { border-color: #e8d060; transform: scale(1.12); background: #26261e; z-index: 2; }
  .char-card canvas { image-rendering: pixelated; }
  .char-name { font-size: 12px; margin-top: 6px; color: #cfcfd8; letter-spacing: 1px; }
  .char-detail {
    width: 620px; min-height: 110px; background: #16161d; border: 3px solid #3a3a4a;
    padding: 14px 18px; margin-top: 6px; font-size: 13px; line-height: 1.6; color: #b8b8c4;
  }
  .stat-row { display: flex; gap: 18px; margin-top: 8px; }
  .stat-chip { background: #0d0d13; border: 2px solid #3a3a4a; padding: 4px 10px; font-size: 12px; color: #8fd0ff; }
  .modal-title { font-size: 22px; color: #e8d060; letter-spacing: 2px; margin-bottom: 14px; }
  .profile-row, .summary-row {
    display: flex; justify-content: space-between; width: 380px;
    padding: 6px 0; border-bottom: 1px dashed #333; font-size: 14px;
  }
  .shop-item {
    display: flex; justify-content: space-between; align-items: center;
    width: 420px; padding: 10px 12px; margin: 5px 0; background: #1c1c26; border: 2px solid #3a3a4a;
  }
  .shop-item .info { font-size: 13px; }
  .shop-item .lvl { color: #8fd0ff; font-size: 11px; }
  .hud {
    position: absolute; top: 0; left: 0; width: 100%; padding: 8px 14px;
    display: flex; justify-content: space-between; color: #fff; font-size: 13px;
    z-index: 5; pointer-events: none; text-shadow: 2px 2px 0 #000;
  }
  #touchControls { display: none; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="960" height="600"></canvas>
  <div class="hud hidden" id="hud"></div>

  <!-- CINEMATIC -->
  <div class="overlay" id="screen-cinematic">
    <button class="pixel-btn" id="skipBtn">Skip &raquo;</button>
    <canvas id="cinemaCanvas" width="960" height="600" style="position:absolute; top:0; left:0;"></canvas>
  </div>

  <!-- NAME SELECT -->
  <div class="overlay hidden" id="screen-name">
    <div class="pixel-panel" style="text-align:center;">
      <div class="title-text" style="font-size:28px;">SURVIVOR REGISTRATION</div>
      <div class="subtitle-text">Enter your name to begin</div>
      <input type="text" id="nameInput" class="name-input" maxlength="14" placeholder="YOUR NAME">
      <br>
      <button class="pixel-btn accent" id="nameContinueBtn" style="margin-top:20px;">Continue &raquo;</button>
    </div>
  </div>

  <!-- CHARACTER SELECT -->
  <div class="overlay hidden" id="screen-character">
    <div class="title-text" style="font-size:24px;">CHOOSE YOUR SURVIVOR</div>
    <div class="char-select-row" id="charRow"></div>
    <div class="char-detail" id="charDetail">Select a survivor to view details.</div>
    <button class="pixel-btn accent hidden" id="confirmCharBtn">Confirm Character</button>
  </div>

  <!-- PROFILE MODAL -->
  <div class="overlay hidden" id="screen-profile">
    <div class="pixel-panel">
      <div class="modal-title">PROFILE</div>
      <div id="profileBody"></div>
      <button class="pixel-btn" id="closeProfileBtn" style="margin-top:16px;">Close</button>
    </div>
  </div>

  <!-- SHOP MODAL -->
  <div class="overlay hidden" id="screen-shop">
    <div class="pixel-panel">
      <div class="modal-title">SHOP <span style="color:#e8d060; font-size:14px;" id="shopCoins"></span></div>
      <div id="shopBody"></div>
      <button class="pixel-btn" id="closeShopBtn" style="margin-top:10px;">Close</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="overlay hidden" id="screen-summary">
    <div class="pixel-panel" style="text-align:center;">
      <div class="modal-title" id="summaryTitle">LEVEL COMPLETE</div>
      <div id="summaryBody"></div>
      <button class="pixel-btn accent" id="summaryContinueBtn" style="margin-top:16px;">Continue &raquo;</button>
    </div>
  </div>

  <!-- BOSS CLEAR CINEMATIC -->
  <div class="overlay hidden" id="screen-bossclear">
    <div class="pixel-panel" style="text-align:center; max-width:600px;">
      <div class="modal-title" style="color:#8fd0ff;">SURVIVOR RESCUED</div>
      <div id="bossClearBody" style="font-size:14px; line-height:1.7; margin-bottom:16px;"></div>
      <button class="pixel-btn accent" id="bossClearContinueBtn">Continue &raquo;</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="screen-gameover">
    <div class="pixel-panel" style="text-align:center;">
      <div class="title-text" style="font-size:30px;">YOU DIED</div>
      <div class="subtitle-text">The city shows no mercy.</div>
      <button class="pixel-btn accent" id="retryBtn">Retry Level</button>
      <button class="pixel-btn" id="toOverworldBtn">Return to Map</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   GLOBAL CANVAS SETUP
===================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const cinemaCanvas = document.getElementById('cinemaCanvas');
const cctx = cinemaCanvas.getContext('2d');
cctx.imageSmoothingEnabled = false;

const W = canvas.width, H = canvas.height;

/* =====================================================================
   GAME STATE ENUM  (prevents menu/cinematic/overworld/gameplay overlap)
===================================================================== */
const GameState = {
  CINEMATIC: 'CINEMATIC',
  NAME_SELECT: 'NAME_SELECT',
  CHARACTER_SELECT: 'CHARACTER_SELECT',
  OVERWORLD: 'OVERWORLD',
  PROFILE: 'PROFILE',
  SHOP: 'SHOP',
  PLAYING: 'PLAYING',
  SUMMARY: 'SUMMARY',
  BOSS_CLEAR: 'BOSS_CLEAR',
  GAME_OVER: 'GAME_OVER'
};
let state = GameState.CINEMATIC;
let previousOverworldState = GameState.OVERWORLD; // for modal returns

function setState(s) {
  // hide all overlay screens, then show the relevant one
  document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
  state = s;
  const map = {
    CINEMATIC: 'screen-cinematic',
    NAME_SELECT: 'screen-name',
    CHARACTER_SELECT: 'screen-character',
    PROFILE: 'screen-profile',
    SHOP: 'screen-shop',
    SUMMARY: 'screen-summary',
    BOSS_CLEAR: 'screen-bossclear',
    GAME_OVER: 'screen-gameover'
  };
  if (map[s]) document.getElementById(map[s]).classList.remove('hidden');
  document.getElementById('hud').classList.toggle('hidden', !(s === GameState.PLAYING || s === GameState.OVERWORLD));
}

/* =====================================================================
   CHARACTERS
===================================================================== */
const CHARACTERS = [
  {
    id: 'brawler', name: 'The Brawler', color: '#c75a3a',
    desc: 'A former dockworker who fights zombies bare-knuckle. Slow but hits like a truck.',
    stats: { health: 140, speed: 3.2, attack: 24 }, trait: 'Trait: +30% melee damage'
  },
  {
    id: 'scavenger', name: 'The Scavenger', color: '#5a8f4a',
    desc: 'Survived by staying light on his feet and looting everything in sight.',
    stats: { health: 100, speed: 4.6, attack: 16 }, trait: 'Trait: +20% coin pickups'
  },
  {
    id: 'medic', name: 'The Medic', color: '#e0e0e0',
    desc: 'Once an ER nurse. Keeps herself standing longer than anyone else out there.',
    stats: { health: 160, speed: 3.6, attack: 14 }, trait: 'Trait: Slow passive health regen'
  },
  {
    id: 'sharpshooter', name: 'The Sharpshooter', color: '#4a6f9f',
    desc: 'Ex-military marksman. Precise, calm under pressure, deadly up close too.',
    stats: { health: 110, speed: 4.0, attack: 20 }, trait: 'Trait: +15% critical chance'
  },
  {
    id: 'biker', name: 'The Biker', color: '#8a3a8a',
    desc: 'Rides the ruins of the highway. Reckless, fast, and always first into a fight.',
    stats: { health: 120, speed: 5.2, attack: 18 }, trait: 'Trait: +25% movement speed'
  }
];

/* =====================================================================
   ZOMBIE TYPES (World 1 - The City)
===================================================================== */
const ZOMBIE_TYPES = {
  walker: { label: 'Walker', color: '#5a6b45', width: 30, height: 46, baseHp: 40, baseDmg: 8, speed: 0.9, coinMult: 1.0 },
  sprinter: { label: 'Sprinter', color: '#7a4a3a', width: 26, height: 44, baseHp: 28, baseDmg: 10, speed: 2.3, coinMult: 1.3 },
  hazmat: { label: 'Hazmat', color: '#c9a227', width: 36, height: 50, baseHp: 90, baseDmg: 14, speed: 0.6, coinMult: 1.8 }
};

/* =====================================================================
   WORLDS DATA (modular master array - append World 2..8 here later)
===================================================================== */
const WORLDS = [
  {
    id: 1,
    name: 'The City',
    bgColor: '#1b1f2b',
    groundColor: '#3a3a3f',
    accentColor: '#c73838',
    zombieLevelRange: [1, 3],
    rewardAbility: 'doubleJump',
    rewardName: 'Double Jump',
    levels: buildWorldLevels(1)
  }
];

function buildWorldLevels(worldNum) {
  const levels = [];
  for (let i = 1; i <= 10; i++) {
    let type = 'normal';
    if (i === 5) type = 'miniboss';
    if (i === 10) type = 'boss';
    levels.push({
      num: i,
      type: type,
      cleared: false,
      // node positions are computed at draw-time for the zig-zag path
    });
  }
  return levels;
}

/* =====================================================================
   PLAYER STATE (persists across levels)
===================================================================== */
const player = {
  name: '', character: null,
  maxHealth: 100, health: 100,
  baseAttack: 15, attack: 15,
  baseSpeed: 4, speed: 4,
  armor: 0,
  coins: 0, lifetimeCoins: 0,
  zombiesSlain: 0,
  hasDoubleJump: false,
  unlockedAbilities: [],
  upgrades: { health: 0, armor: 0, damage: 0, speed: 0 },
  currentWorld: 0,
  furthestLevel: 1, // furthest unlocked level in current world
};

const UPGRADE_DEFS = {
  health: { label: 'Max Health', perLevel: 15, baseCost: 40, costMult: 1.6, max: 6 },
  armor: { label: 'Armor / Defense', perLevel: 2, baseCost: 50, costMult: 1.7, max: 6 },
  damage: { label: 'Damage Output', perLevel: 4, baseCost: 45, costMult: 1.65, max: 6 },
  speed: { label: 'Speed', perLevel: 0.35, baseCost: 35, costMult: 1.6, max: 5 }
};

function recomputePlayerStats() {
  const c = player.character;
  player.maxHealth = c.stats.health + player.upgrades.health * UPGRADE_DEFS.health.perLevel;
  player.baseAttack = c.stats.attack + player.upgrades.damage * UPGRADE_DEFS.damage.perLevel;
  player.baseSpeed = c.stats.speed + player.upgrades.speed * UPGRADE_DEFS.speed.perLevel;
  player.armor = player.upgrades.armor * UPGRADE_DEFS.armor.perLevel;
  if (c.id === 'brawler') player.baseAttack *= 1.3;
  if (c.id === 'biker') player.baseSpeed *= 1.25;
}

function upgradeCost(key) {
  const def = UPGRADE_DEFS[key];
  const lvl = player.upgrades[key];
  return Math.round(def.baseCost * Math.pow(def.costMult, lvl));
}

/* =====================================================================
   INPUT HANDLING
===================================================================== */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === GameState.PLAYING) handleGameplayKeydown(e);
  if (state === GameState.OVERWORLD) handleOverworldKeydown(e);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  if (state === GameState.OVERWORLD) handleOverworldClick(mx, my);
  else if (state === GameState.PLAYING) doMeleeAttack();
});

/* =====================================================================
   OPENING CINEMATIC (motion-comic style, ~10s, skippable)
===================================================================== */
const cinematicScenes = [
  { duration: 2600, draw: drawSceneSkyline },
  { duration: 2600, draw: drawScenePanic },
  { duration: 2600, draw: drawSceneOutbreak },
  { duration: 2200, draw: drawSceneAftermath }
];
let cinematicStart = performance.now();
let cinematicElapsedBefore = 0;

function drawSceneSkyline(t, progress) {
  // slow pan across a skyline
  const pan = -40 * progress;
  cctx.fillStyle = '#0d1420';
  cctx.fillRect(0, 0, W, H);
  // sky gradient
  const grad = cctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a2438'); grad.addColorStop(1, '#3a2f3a');
  cctx.fillStyle = grad; cctx.fillRect(0, 0, W, H * 0.7);
  cctx.save();
  cctx.translate(pan, 0);
  for (let i = -1; i < 8; i++) {
    const bx = i * 140 + 60;
    const bh = 180 + ((i * 53) % 220);
    cctx.fillStyle = i % 2 === 0 ? '#232838' : '#1c2030';
    cctx.fillRect(bx, H * 0.7 - bh, 100, bh + 200);
    // windows
    cctx.fillStyle = '#e8c04a';
    for (let wy = H * 0.7 - bh + 12; wy < H * 0.68; wy += 20) {
      for (let wx = bx + 10; wx < bx + 90; wx += 18) {
        if ((Math.floor(wx + wy) % 3) === 0) cctx.fillRect(wx, wy, 8, 10);
      }
    }
  }
  cctx.restore();
  cctx.fillStyle = '#111621';
  cctx.fillRect(0, H * 0.68, W, H * 0.32);
  drawCaption('THE OUTBREAK BEGAN WITHOUT WARNING...');
}
function drawScenePanic(t, progress) {
  cctx.fillStyle = '#241a1a'; cctx.fillRect(0, 0, W, H);
  cctx.fillStyle = '#2c2020'; cctx.fillRect(0, H*0.6, W, H*0.4);
  const zoom = 1 + 0.06 * progress;
  cctx.save();
  cctx.translate(W/2, H/2); cctx.scale(zoom, zoom); cctx.translate(-W/2, -H/2);
  for (let i = 0; i < 10; i++) {
    const px = ((i * 97 + progress * 60) % (W + 80)) - 40;
    const py = H * 0.62 + (i % 3) * 26;
    cctx.fillStyle = '#d8c8a0';
    cctx.fillRect(px, py, 10, 24);
    cctx.fillStyle = '#3a3028';
    cctx.fillRect(px - 2, py + 24, 14, 6);
  }
  cctx.restore();
  drawCaption('PEOPLE RAN. THE STREETS EMPTIED IN HOURS.');
}
function drawSceneOutbreak(t, progress) {
  cctx.fillStyle = '#1a2418'; cctx.fillRect(0, 0, W, H);
  cctx.fillStyle = '#101a10'; cctx.fillRect(0, H*0.6, W, H*0.4);
  const slide = -30 * progress;
  cctx.save(); cctx.translate(slide, 0);
  for (let i = 0; i < 7; i++) {
    const zx = i * 130 + 80;
    const zy = H * 0.6;
    cctx.fillStyle = '#5a6b45';
    cctx.fillRect(zx, zy, 22, 38);
    cctx.fillStyle = '#8fae6a';
    cctx.fillRect(zx + 4, zy - 14, 14, 16);
    cctx.fillStyle = '#c73838';
    cctx.fillRect(zx + 6, zy - 8, 4, 3);
    cctx.fillRect(zx + 12, zy - 8, 4, 3);
  }
  cctx.restore();
  drawCaption('AND THE DEAD DID NOT STAY DOWN.');
}
function drawSceneAftermath(t, progress) {
  cctx.fillStyle = '#15151d'; cctx.fillRect(0, 0, W, H);
  const alpha = Math.min(1, progress * 1.5);
  cctx.globalAlpha = alpha;
  cctx.fillStyle = '#c73838';
  cctx.font = 'bold 46px Courier New';
  cctx.textAlign = 'center';
  cctx.fillText('DEADWALK', W/2, H/2 - 10);
  cctx.globalAlpha = 1;
  drawCaption('ONE SURVIVOR MUST RECLAIM THE CITY.');
}
function drawCaption(text) {
  cctx.textAlign = 'center';
  cctx.font = '16px Courier New';
  cctx.fillStyle = 'rgba(0,0,0,0.55)';
  cctx.fillRect(W/2 - 320, H - 70, 640, 44);
  cctx.fillStyle = '#e0e0e8';
  cctx.fillText(text, W/2, H - 44);
}

function runCinematic(now) {
  const elapsed = cinematicElapsedBefore + (now - cinematicStart);
  let acc = 0;
  for (const scene of cinematicScenes) {
    if (elapsed < acc + scene.duration) {
      const progress = (elapsed - acc) / scene.duration;
      scene.draw(elapsed, progress);
      return;
    }
    acc += scene.duration;
  }
  // sequence finished
  goToNameSelect();
}
function goToNameSelect() { setState(GameState.NAME_SELECT); }
document.getElementById('skipBtn').addEventListener('click', goToNameSelect);

/* =====================================================================
   NAME SELECT -> CHARACTER SELECT
===================================================================== */
document.getElementById('nameContinueBtn').addEventListener('click', () => {
  const val = document.getElementById('nameInput').value.trim();
  player.name = val || 'Survivor';
  setState(GameState.CHARACTER_SELECT);
  buildCharacterSelectUI();
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.code === 'Enter') document.getElementById('nameContinueBtn').click();
});

let selectedCharIndex = -1;
function buildCharacterSelectUI() {
  const row = document.getElementById('charRow');
  row.innerHTML = '';
  CHARACTERS.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.id = 'charcard-' + idx;
    const mini = document.createElement('canvas');
    mini.width = 60; mini.height = 70;
    mini.getContext('2d').imageSmoothingEnabled = false;
    drawMiniCharacter(mini.getContext('2d'), c, 0);
    card.appendChild(mini);
    const label = document.createElement('div');
    label.className = 'char-name';
    label.textContent = c.name;
    card.appendChild(label);
    card.addEventListener('click', () => selectCharacter(idx));
    row.appendChild(card);
  });
}
let charAnimTick = 0;
function drawMiniCharacter(g, c, tick) {
  g.clearRect(0, 0, 60, 70);
  const bob = Math.sin(tick / 8) * 3;
  g.fillStyle = c.color;
  g.fillRect(18, 20 + bob, 24, 30); // torso
  g.fillStyle = '#e0c8a0';
  g.fillRect(20, 6 + bob, 20, 16); // head
  g.fillStyle = '#333';
  g.fillRect(24, 12 + bob, 4, 3); g.fillRect(32, 12 + bob, 4, 3); // eyes
  g.fillStyle = '#2a2a30';
  g.fillRect(16, 50 + bob, 10, 16); g.fillRect(34, 50 + bob, 10, 16); // legs
  // weapon swing arc for action animation
  const swing = Math.sin(tick / 6);
  g.strokeStyle = '#ddd'; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(42, 30 + bob);
  g.lineTo(50 + swing * 8, 18 + bob - swing * 6);
  g.stroke();
}
function selectCharacter(idx) {
  selectedCharIndex = idx;
  document.querySelectorAll('.char-card').forEach((el, i) => el.classList.toggle('selected', i === idx));
  const c = CHARACTERS[idx];
  document.getElementById('charDetail').innerHTML = `
    <strong>${c.name}</strong><br>${c.desc}<br>
    <div class="stat-row">
      <span class="stat-chip">HP ${c.stats.health}</span>
      <span class="stat-chip">SPD ${c.stats.speed.toFixed(1)}</span>
      <span class="stat-chip">ATK ${c.stats.attack}</span>
    </div>
    <div style="margin-top:8px; color:#e8d060;">${c.trait}</div>`;
  document.getElementById('confirmCharBtn').classList.remove('hidden');
}
document.getElementById('confirmCharBtn').addEventListener('click', () => {
  if (selectedCharIndex < 0) return;
  player.character = CHARACTERS[selectedCharIndex];
  recomputePlayerStats();
  player.health = player.maxHealth;
  enterOverworld();
});
// animate mini character cards while on character select screen
setInterval(() => {
  if (state !== GameState.CHARACTER_SELECT) return;
  charAnimTick++;
  document.querySelectorAll('#charRow .char-card').forEach((card, idx) => {
    const g = card.querySelector('canvas').getContext('2d');
    drawMiniCharacter(g, CHARACTERS[idx], idx === selectedCharIndex ? charAnimTick : charAnimTick * 0.3);
  });
}, 60);

/* =====================================================================
   OVERWORLD (Mario-style world map)
===================================================================== */
const overworld = {
  avatarNodeIndex: 0, // which node index player is standing at/near
  avatarX: 0, avatarY: 0, // pixel pos, derived from node path progress
  pathProgress: 0, // 0 = at avatarNodeIndex, moves toward node+1
  moving: 0, // -1, 0, 1 direction of travel along path
  nodePositions: []
};

function computeNodePositions() {
  const positions = [];
  const cols = 5;
  for (let i = 0; i < 10; i++) {
    const row = Math.floor(i / cols);
    const colInRow = i % cols;
    const xBase = 100 + colInRow * 170;
    const x = row % 2 === 0 ? xBase : (100 + (cols - 1 - colInRow) * 170);
    const y = 150 + row * 260;
    positions.push({ x, y });
  }
  return positions;
}

function enterOverworld() {
  overworld.nodePositions = computeNodePositions();
  const idx = Math.min(player.furthestLevel - 1, 9);
  overworld.avatarNodeIndex = idx;
  const p = overworld.nodePositions[idx];
  overworld.avatarX = p.x; overworld.avatarY = p.y;
  overworld.pathProgress = 0;
  setState(GameState.OVERWORLD);
}

function handleOverworldKeydown(e) {
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'KeyW') {
    tryEnterLevelAtCurrentNode();
  }
}
function handleOverworldClick(mx, my) {
  // check profile/shop buttons drawn on canvas HUD area
  if (my < 40) {
    if (mx > W - 200 && mx < W - 105) { openProfile(); return; }
    if (mx > W - 100 && mx < W - 10) { openShop(); return; }
  }
  // check if a node was clicked directly for quick travel (only unlocked ones)
  overworld.nodePositions.forEach((p, i) => {
    const dist = Math.hypot(mx - p.x, my - p.y);
    if (dist < 26 && i <= player.furthestLevel - 1) {
      overworld.avatarNodeIndex = i;
      overworld.avatarX = p.x; overworld.avatarY = p.y;
    }
  });
}
function tryEnterLevelAtCurrentNode() {
  const idx = overworld.avatarNodeIndex;
  if (idx > player.furthestLevel - 1) return; // locked
  startLevel(idx + 1);
}
function updateOverworldMovement() {
  const speed = 3.2;
  let dx = 0, dy = 0;
  if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
  if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
  if (keys['ArrowDown'] || keys['KeyS']) dy = 1;
  if (keys['ArrowUp'] || keys['KeyW'] && false) dy = -1;
  if (dx === 0 && dy === 0) return;
  const positions = overworld.nodePositions;
  const cur = positions[overworld.avatarNodeIndex];
  // find nearest reachable neighbor in the intended direction among unlocked nodes
  let best = -1, bestScore = -Infinity;
  const maxIdx = player.furthestLevel - 1;
  [overworld.avatarNodeIndex - 1, overworld.avatarNodeIndex + 1].forEach(ni => {
    if (ni < 0 || ni > 9 || ni > maxIdx) return;
    const np = positions[ni];
    const vx = np.x - cur.x, vy = np.y - cur.y;
    const len = Math.hypot(vx, vy) || 1;
    const score = (vx/len) * dx + (vy/len) * dy;
    if (score > 0.3 && score > bestScore) { bestScore = score; best = ni; }
  });
  if (best === -1) return;
  const target = positions[best];
  const vx = target.x - overworld.avatarX, vy = target.y - overworld.avatarY;
  const dist = Math.hypot(vx, vy);
  if (dist < speed) {
    overworld.avatarX = target.x; overworld.avatarY = target.y;
    overworld.avatarNodeIndex = best;
  } else {
    overworld.avatarX += (vx / dist) * speed;
    overworld.avatarY += (vy / dist) * speed;
  }
}

function drawOverworld() {
  const world = WORLDS[player.currentWorld];
  ctx.fillStyle = world.bgColor;
  ctx.fillRect(0, 0, W, H);
  // faint skyline backdrop
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 8; i++) ctx.fillRect(i * 130 + 20, 0, 60, H);

  const positions = overworld.nodePositions;
  // draw connecting path
  ctx.strokeStyle = '#4a4a56'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath();
  positions.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();
  ctx.strokeStyle = '#2c2c34'; ctx.lineWidth = 3;
  ctx.beginPath();
  positions.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();

  // draw nodes
  positions.forEach((p, i) => {
    const lvlDef = world.levels[i];
    const unlocked = i <= player.furthestLevel - 1;
    const cleared = lvlDef.cleared;
    let fill = unlocked ? '#3a3a48' : '#222228';
    if (lvlDef.type === 'boss') fill = unlocked ? '#7a2020' : '#331616';
    else if (lvlDef.type === 'miniboss') fill = unlocked ? '#7a5a20' : '#332816';
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = cleared ? '#8fd056' : (unlocked ? '#e8d060' : '#4a4a52');
    ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = unlocked ? '#fff' : '#666';
    ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), p.x, p.y + 5);
    if (lvlDef.type === 'boss') { ctx.font = '10px Courier New'; ctx.fillStyle = '#ffb0b0'; ctx.fillText('BOSS', p.x, p.y - 32); }
    if (lvlDef.type === 'miniboss') { ctx.font = '10px Courier New'; ctx.fillStyle = '#ffe0a0'; ctx.fillText('MINI-BOSS', p.x, p.y - 32); }
    if (cleared) { ctx.font = '14px Courier New'; ctx.fillStyle = '#8fd056'; ctx.fillText('\u2713', p.x + 30, p.y - 22); }
  });

  // draw avatar
  drawWorldMapAvatar(overworld.avatarX, overworld.avatarY);

  // HUD text
  ctx.textAlign = 'left'; ctx.font = '13px Courier New'; ctx.fillStyle = '#fff';
  ctx.fillText(world.name.toUpperCase() + ' - WORLD ' + world.id, 14, 24);
  ctx.fillText('Coins: ' + player.coins, 14, 44);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#cfcfd8';
  ctx.fillText('[E/Space to enter level]', W - 14, H - 14);

  // Profile / Shop buttons (top-right, drawn each frame)
  drawTopButton(W - 200, 8, 95, 26, 'Profile');
  drawTopButton(W - 100, 8, 90, 26, 'Shop');
}
function drawTopButton(x, y, w, h, label) {
  ctx.fillStyle = '#2a2a38'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a5a68'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#e0e0e8'; ctx.font = '12px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 4);
}
function drawWorldMapAvatar(x, y) {
  const c = player.character;
  ctx.fillStyle = c.color;
  ctx.fillRect(x - 8, y - 20, 16, 20);
  ctx.fillStyle = '#e0c8a0';
  ctx.fillRect(x - 6, y - 32, 12, 12);
  ctx.fillStyle = '#2a2a30';
  ctx.fillRect(x - 8, y, 6, 10); ctx.fillRect(x + 2, y, 6, 10);
}

function openProfile() {

  const body = document.getElementById('profileBody');
  body.innerHTML = `
    <div class="profile-row"><span>Player Name</span><span>${player.name}</span></div>
    <div class="profile-row"><span>Character</span><span>${player.character.name}</span></div>
    <div class="profile-row"><span>Lifetime Coins</span><span>${player.lifetimeCoins}</span></div>
    <div class="profile-row"><span>Zombies Slain</span><span>${player.zombiesSlain}</span></div>
    <div class="profile-row"><span>Unlocked Abilities</span><span>${player.unlockedAbilities.length ? player.unlockedAbilities.join(', ') : 'None yet'}</span></div>
  `;
  setState(GameState.PROFILE);
}
document.getElementById('closeProfileBtn').addEventListener('click', () => setState(previousOverworldState));

/* =====================================================================
   SHOP MODAL
===================================================================== */
function openShop() {
  previousOverworldState = state;
  renderShop();
  setState(GameState.SHOP);
}
function renderShop() {
  document.getElementById('shopCoins').textContent = 'Coins: ' + player.coins;
  const body = document.getElementById('shopBody');
  body.innerHTML = '';
  Object.keys(UPGRADE_DEFS).forEach(key => {
    const def = UPGRADE_DEFS[key];
    const lvl = player.upgrades[key];
    const maxed = lvl >= def.max;
    const cost = maxed ? 0 : upgradeCost(key);
    const row = document.createElement('div');
    row.className = 'shop-item';
    row.innerHTML = `
      <div class="info"><strong>${def.label}</strong><div class="lvl">Level ${lvl}/${def.max}</div></div>
      <button class="pixel-btn" ${maxed || player.coins < cost ? 'disabled' : ''}>${maxed ? 'MAXED' : 'Buy (' + cost + 'c)'}</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      if (maxed || player.coins < cost) return;
      player.coins -= cost;
      player.upgrades[key]++;
      recomputePlayerStats();
      player.health = Math.min(player.health, player.maxHealth);
      renderShop();
    });
    body.appendChild(row);
  });
}
document.getElementById('closeShopBtn').addEventListener('click', () => setState(previousOverworldState));

/* =====================================================================
   LEVEL / GAMEPLAY
===================================================================== */
let level = null; // active level runtime object

function startLevel(levelNum) {
  const world = WORLDS[player.currentWorld];
  const def = world.levels[levelNum - 1];
  const groundY = H - 90;
  level = {
    num: levelNum, def, world,
    groundY,
    camX: 0,
    levelWidth: def.type === 'boss' ? 2600 : (def.type === 'miniboss' ? 2200 : 1800),
    zombies: [],
    obstacles: [],
    damageNumbers: [],
    slashParticles: [],
    zombiesSlainThisLevel: 0,
    coinsThisLevel: 0,
    survivorsSavedThisLevel: 0,
    survivorRescueX: null,
    survivorRescued: false,
    lastAttackTime: -9999,
    attackCooldown: 420,
    startTime: performance.now()
  };
  player.px = 60; player.py = groundY - 48;
  player.pvx = 0; player.pvy = 0;
  player.onGround = true;
  player.jumpCount = 0;
  player.maxJumps = player.hasDoubleJump ? 2 : 1;
  player.facing = 1;
  player.health = player.maxHealth;
  populateLevel(level);
  setState(GameState.PLAYING);
}

function populateLevel(lv) {
  const [lo, hi] = lv.world.zombieLevelRange;
  const isBoss = lv.def.type === 'boss';
  const isMini = lv.def.type === 'miniboss';
  // obstacles (cover crates / streetlamps) spaced along level
  for (let x = 300; x < lv.levelWidth - 300; x += 260 + (x % 3) * 40) {
    lv.obstacles.push({ x, y: lv.groundY - 34, w: 34, h: 34, type: 'crate' });
  }
  if (isBoss) {
    const zlevel = hi + 3;
    lv.zombies.push(makeZombie('hazmat', lv.levelWidth - 260, zlevel, true));
  } else if (isMini) {
    const zlevel = hi + 1;
    lv.zombies.push(makeZombie('hazmat', lv.levelWidth - 300, zlevel, false, true));
    lv.zombies.push(makeZombie('sprinter', lv.levelWidth - 460, Math.max(lo, zlevel - 2)));
  } else {
    const count = 5 + Math.floor(lv.num / 2);
    const types = ['walker', 'walker', 'sprinter', 'hazmat'];
    for (let i = 0; i < count; i++) {
      const t = types[Math.floor(Math.random() * types.length)];
      const lvl_ = lo + Math.floor(Math.random() * (hi - lo + 1));
      const x = 420 + i * (lv.levelWidth - 600) / count + (Math.random() * 80 - 40);
      lv.zombies.push(makeZombie(t, x, lvl_));
    }
  }
  if (isBoss) lv.survivorRescueX = lv.levelWidth - 100;
}

function makeZombie(typeKey, x, zLevel, isBossFlag, isMiniFlag) {
  const t = ZOMBIE_TYPES[typeKey];
  const hpScale = 1 + (zLevel - 1) * 0.35;
  const dmgScale = 1 + (zLevel - 1) * 0.18;
  const maxHp = Math.round(t.baseHp * hpScale * (isBossFlag ? 3.4 : isMiniFlag ? 1.8 : 1));
  return {
    typeKey, def: t, x, y: level ? level.groundY - t.height : 0,
    width: t.width, height: t.height,
    maxHp, hp: maxHp,
    dmg: Math.round(t.baseDmg * dmgScale),
    level: zLevel,
    speed: t.speed * (isBossFlag ? 0.8 : 1),
    vx: 0, alive: true, facing: -1,
    isBoss: !!isBossFlag, isMini: !!isMiniFlag,
    hitFlashTimer: 0, showHealthBarTimer: 0,
    attackCooldown: 0,
    coinValue: Math.round((4 + zLevel * 2) * t.coinMult * (isBossFlag ? 6 : isMiniFlag ? 2.5 : 1))
  };
}

function handleGameplayKeydown(e) {
  if (e.code === 'Space' || e.code === 'KeyW') doJump();
  if (e.code === 'KeyJ') doMeleeAttack();
}
function doJump() {
  if (!level) return;
  if (player.onGround) {
    player.pvy = -12.5;
    player.onGround = false;
    player.jumpCount = 1;
  } else if (player.hasDoubleJump && player.jumpCount < player.maxJumps) {
    player.pvy = -11;
    player.jumpCount++;
  }
}
function doMeleeAttack() {
  if (state !== GameState.PLAYING || !level) return;
  const now = performance.now();
  if (now - level.lastAttackTime < level.attackCooldown) return;
  level.lastAttackTime = now;
  const reach = 52;
  const ax = player.px + player.facing * reach / 2 + 24;
  level.slashParticles.push({ x: ax, y: player.py + 20, dir: player.facing, life: 160, born: now });
  level.zombies.forEach(z => {
    if (!z.alive) return;
    const dx = (z.x + z.width / 2) - (player.px + 24);
    if (Math.sign(dx || 1) !== player.facing && Math.abs(dx) > 4) return;
    if (Math.abs(dx) < reach && Math.abs((z.y + z.height/2) - (player.py + 24)) < 60) {
      let dmg = player.baseAttack;
      const crit = player.character.id === 'sharpshooter' && Math.random() < 0.15;
      if (crit) dmg *= 1.8;
      dmg = Math.round(dmg * (0.9 + Math.random() * 0.2));
      z.hp -= dmg;
      z.hitFlashTimer = 140;
      z.showHealthBarTimer = 2200;
      level.damageNumbers.push({ x: z.x + z.width/2, y: z.y, text: (crit ? 'CRIT ' : '') + '-' + dmg, life: 800, born: now, crit });
      if (z.hp <= 0 && z.alive) killZombie(z);
    }
  });
}
function killZombie(z) {
  z.alive = false;
  player.zombiesSlain++;
  level.zombiesSlainThisLevel++;
  let coins = z.coinValue;
  if (player.character.id === 'scavenger') coins = Math.round(coins * 1.2);
  player.coins += coins;
  player.lifetimeCoins += coins;
  level.coinsThisLevel += coins;
  if ((z.isBoss) && level.def.type === 'boss') {
    onBossDefeated();
  }
}

function updateGameplay(dt) {
  if (!level) return;
  const lv = level;
  const speed = player.baseSpeed;
  let moveX = 0;
  if (keys['ArrowRight'] || keys['KeyD']) { moveX = 1; player.facing = 1; }
  if (keys['ArrowLeft'] || keys['KeyA']) { moveX = -1; player.facing = -1; }
  player.pvx = moveX * speed;

  // --- X axis collision first ---
  let nextX = player.px + player.pvx;
  nextX = Math.max(0, Math.min(lv.levelWidth - 48, nextX));
  const px1 = nextX, px2 = nextX + 48;
  let blockedX = false;
  lv.obstacles.forEach(o => {
    if (px2 > o.x && px1 < o.x + o.w && player.py + 48 > o.y && player.py < o.y + o.h) blockedX = true;
  });
  if (!blockedX) player.px = nextX;

  // --- Y axis (gravity) second ---
  player.pvy += 0.55; // gravity
  if (player.pvy > 16) player.pvy = 16;
  let nextY = player.py + player.pvy;
  const floorY = lv.groundY - 48;
  player.onGround = false;
  if (nextY >= floorY) {
    nextY = floorY; player.pvy = 0; player.onGround = true; player.jumpCount = 0;
  } else {
    // obstacle top landing
    lv.obstacles.forEach(o => {
      const willOverlapX = (player.px + 48 > o.x && player.px < o.x + o.w);
      if (willOverlapX && player.pvy >= 0 && player.py + 48 <= o.y + 2 && nextY + 48 >= o.y) {
        nextY = o.y - 48; player.pvy = 0; player.onGround = true; player.jumpCount = 0;
      }
    });
  }
  player.py = nextY;

  // camera follow
  lv.camX = Math.max(0, Math.min(lv.levelWidth - W, player.px - W / 2));

  // zombies AI
  lv.zombies.forEach(z => {
    if (!z.alive) return;
    z.hitFlashTimer = Math.max(0, z.hitFlashTimer - dt);
    z.showHealthBarTimer = Math.max(0, z.showHealthBarTimer - dt);
    const dx = (player.px + 24) - (z.x + z.width / 2);
    const dist = Math.abs(dx);
    z.facing = dx > 0 ? 1 : -1;
    if (dist < 480) {
      if (dist > 40) {
        z.x += Math.sign(dx) * z.speed;
      } else {
        z.attackCooldown -= dt;
        if (z.attackCooldown <= 0) {
          z.attackCooldown = 900;
          const dmgTaken = Math.max(1, Math.round(z.dmg - player.armor));
          player.health -= dmgTaken;
          lv.damageNumbers.push({ x: player.px + 24, y: player.py, text: '-' + dmgTaken, life: 800, born: performance.now(), playerHit: true });
          if (player.health <= 0) { player.health = 0; onPlayerDeath(); }
        }
      }
    }
  });

  // survivor rescue trigger (boss level, after boss defeated)
  if (lv.survivorRescueX && lv.survivorRescued === false && lv.bossCleared) {
    if (Math.abs(player.px - lv.survivorRescueX) < 40 && (keys['KeyE'])) {
      lv.survivorRescued = true;
      lv.survivorsSavedThisLevel = 1;
    }
  }

  // clean up damage numbers / slash particles (reverse loop to avoid index issues)
  const now = performance.now();
  for (let i = lv.damageNumbers.length - 1; i >= 0; i--) {
    if (now - lv.damageNumbers[i].born > lv.damageNumbers[i].life) lv.damageNumbers.splice(i, 1);
  }
  for (let i = lv.slashParticles.length - 1; i >= 0; i--) {
    if (now - lv.slashParticles[i].born > lv.slashParticles[i].life) lv.slashParticles.splice(i, 1);
  }

  // level completion check (non-boss): reach far right edge with all zombies engaged is not required;
  // simplest robust rule: reach end of level AND (not boss level OR boss defeated)
  if (player.px > lv.levelWidth - 90) {
    if (lv.def.type === 'boss') {
      if (lv.bossCleared && lv.survivorRescued) finishLevel();
    } else if (lv.def.type === 'miniboss') {
      const miniAlive = lv.zombies.some(z => z.isMini && z.alive);
      if (!miniAlive) finishLevel();
    } else {
      finishLevel();
    }
  }
}
function onBossDefeated() {
  level.bossCleared = true;
}
function onPlayerDeath() {
  setState(GameState.GAME_OVER);
}

function finishLevel() {
  level.def.cleared = true;
  if (level.num >= player.furthestLevel) player.furthestLevel = Math.min(10, level.num + 1);
  const body = document.getElementById('summaryBody');
  body.innerHTML = `
    <div class="summary-row"><span>Zombies Slain</span><span>${level.zombiesSlainThisLevel}</span></div>
    <div class="summary-row"><span>Bonus Coins (by level)</span><span>${level.coinsThisLevel}</span></div>
    <div class="summary-row"><span>Survivors Saved</span><span>${level.survivorsSavedThisLevel}</span></div>
    <div class="summary-row"><span><strong>Total Coins Awarded</strong></span><span><strong>${level.coinsThisLevel}</strong></span></div>
  `;
  document.getElementById('summaryTitle').textContent = 'LEVEL ' + level.num + ' COMPLETE';
  if (level.def.type === 'boss') {
    setState(GameState.BOSS_CLEAR);
    document.getElementById('bossClearBody').innerHTML =
      `The rescued survivor steps forward, offering their last piece of gear before collapsing with relief.<br><br>
       "${player.name}, take this. You'll need it out there."<br><br>
       <strong style="color:#e8d060;">You unlocked: ${level.world.rewardName}!</strong>`;
    if (!player.unlockedAbilities.includes(level.world.rewardName)) {
      player.unlockedAbilities.push(level.world.rewardName);
    }
    player.hasDoubleJump = true;
  } else {
    setState(GameState.SUMMARY);
  }
}
document.getElementById('summaryContinueBtn').addEventListener('click', () => { level = null; enterOverworld(); });
document.getElementById('bossClearContinueBtn').addEventListener('click', () => { level = null; enterOverworld(); });
document.getElementById('retryBtn').addEventListener('click', () => { startLevel(level.num); });
document.getElementById('toOverworldBtn').addEventListener('click', () => { level = null; enterOverworld(); });

/* =====================================================================
   GAMEPLAY RENDERING
===================================================================== */
function drawGameplay() {
  const lv = level;
  ctx.save();
  // sky / background parallax
  ctx.fillStyle = lv.world.bgColor;
  ctx.fillRect(0, 0, W, H);
  drawCityBackdrop(lv.camX);

  ctx.translate(-lv.camX, 0);

  // ground
  ctx.fillStyle = lv.world.groundColor;
  ctx.fillRect(0, lv.groundY + 48, lv.levelWidth, H - lv.groundY - 48);
  ctx.fillStyle = '#26262c';
  for (let x = 0; x < lv.levelWidth; x += 60) ctx.fillRect(x, lv.groundY + 48, 2, H - lv.groundY - 48);

  // obstacles (crates)
  lv.obstacles.forEach(o => {
    ctx.fillStyle = '#6b5030';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
  });

  // survivor marker at boss levels
  if (lv.survivorRescueX && lv.bossCleared && !lv.survivorRescued) {
    ctx.fillStyle = '#8fd0ff';
    ctx.fillRect(lv.survivorRescueX - 8, lv.groundY - 40, 16, 40);
    ctx.fillStyle = '#fff'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('Press E to Rescue', lv.survivorRescueX, lv.groundY - 50);
  }

  // zombies
  lv.zombies.forEach(z => drawZombie(z));

  // slash particles
  lv.slashParticles.forEach(p => {
    const age = (performance.now() - p.born) / p.life;
    ctx.globalAlpha = 1 - age;
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, p.dir > 0 ? -0.9 : Math.PI - 0.3, p.dir > 0 ? 0.9 : Math.PI + 0.3);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // player
  drawPlayerCharacter();

  // damage numbers (drawn after camera translate so they follow world position)
  lv.damageNumbers.forEach(d => {
    const age = (performance.now() - d.born) / d.life;
    ctx.globalAlpha = Math.max(0, 1 - age);
    ctx.fillStyle = d.playerHit ? '#ff5050' : (d.crit ? '#ffcf40' : '#fff');
    ctx.font = (d.crit ? 'bold 16px' : '13px') + ' Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(d.text, d.x, d.y - 20 - age * 30);
    ctx.globalAlpha = 1;
  });

  ctx.restore();

  // HUD (screen space, not world space)
  drawGameplayHUD();
}

function drawCityBackdrop(camX) {
  ctx.save();
  ctx.translate(-camX * 0.3, 0);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let i = -1; i < 20; i++) {
    ctx.fillRect(i * 150 + 20, 40, 90, 260);
  }
  ctx.restore();
}

function drawZombie(z) {
  if (!z.alive) return;
  const flashing = z.hitFlashTimer > 0;
  ctx.fillStyle = flashing ? '#ffffff' : z.def.color;
  ctx.fillRect(z.x, z.y, z.width, z.height);
  ctx.fillStyle = '#3a3a2a';
  ctx.fillRect(z.x + z.width/2 - 6, z.y - 4, 12, 10); // head shadow
  // level badge
  ctx.fillStyle = '#000000aa';
  ctx.fillRect(z.x + z.width/2 - 16, z.y - 34, 32, 14);
  ctx.fillStyle = z.isBoss ? '#ff6060' : z.isMini ? '#ffcf60' : '#cfe0ff';
  ctx.font = '10px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('Lv.' + z.level, z.x + z.width/2, z.y - 24);
  // health bar (only while recently damaged, or always for boss/mini)
  if (z.showHealthBarTimer > 0 || z.isBoss || z.isMini) {
    const barW = z.width + 10;
    ctx.fillStyle = '#222';
    ctx.fillRect(z.x - 5, z.y - 18, barW, 6);
    ctx.fillStyle = z.isBoss ? '#c73838' : z.isMini ? '#c98f20' : '#5fbf4a';
    ctx.fillRect(z.x - 5, z.y - 18, barW * Math.max(0, z.hp / z.maxHp), 6);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(z.x - 5, z.y - 18, barW, 6);
  }
}

function drawPlayerCharacter() {
  const c = player.character;
  const bob = player.onGround ? 0 : Math.sin(performance.now() / 90) * 2;
  ctx.save();
  if (player.facing < 0) { ctx.translate(player.px + 24, 0); ctx.scale(-1, 1); ctx.translate(-(player.px + 24), 0); }
  ctx.fillStyle = c.color;
  ctx.fillRect(player.px + 8, player.py + 14 + bob, 32, 26);
  ctx.fillStyle = '#e0c8a0';
  ctx.fillRect(player.px + 12, player.py + bob, 24, 18);
  ctx.fillStyle = '#2a2a30';
  ctx.fillRect(player.px + 10, player.py + 40 + bob, 12, 8);
  ctx.fillRect(player.px + 26, player.py + 40 + bob, 12, 8);
  ctx.restore();
}

function drawGameplayHUD() {
  // health bar
  ctx.fillStyle = '#000a'; ctx.fillRect(10, 10, 210, 22);
  ctx.fillStyle = '#c73838';
  ctx.fillRect(13, 13, 204 * Math.max(0, player.health / player.maxHealth), 16);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(10, 10, 210, 22);
  ctx.fillStyle = '#fff'; ctx.font = '12px Courier New'; ctx.textAlign = 'left';
  ctx.fillText(Math.max(0, Math.round(player.health)) + ' / ' + player.maxHealth, 16, 26);

  ctx.font = '13px Courier New';
  ctx.fillText('Coins: ' + player.coins, 10, 52);
  ctx.fillText('World ' + level.world.id + ' - Level ' + level.num, 10, 70);
  if (level.def.type === 'boss' && !level.bossCleared) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ff8080'; ctx.font = 'bold 16px Courier New';
    ctx.fillText('WORLD BOSS', W/2, 30);
  } else if (level.def.type === 'miniboss') {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffcf80'; ctx.font = 'bold 14px Courier New';
    ctx.fillText('MINI-BOSS', W/2, 30);
  }
  ctx.textAlign = 'right'; ctx.font = '11px Courier New'; ctx.fillStyle = '#cfcfd8';
  ctx.fillText('A/D move  |  Space/W jump' + (player.hasDoubleJump ? ' (x2)' : '') + '  |  J/Click attack', W - 10, H - 10);
}

/* =====================================================================
   MASTER LOOP
===================================================================== */
let lastTime = performance.now();
function masterLoop(now) {
  const dt = Math.min(40, now - lastTime);
  lastTime = now;

  switch (state) {
    case GameState.CINEMATIC:
      runCinematic(now);
      break;
    case GameState.OVERWORLD:
      updateOverworldMovement();
      drawOverworld();
      break;
    case GameState.PLAYING:
      updateGameplay(dt);
      drawGameplay();
      break;
    // NAME_SELECT, CHARACTER_SELECT, PROFILE, SHOP, SUMMARY, BOSS_CLEAR, GAME_OVER
    // are pure HTML overlay screens; nothing to draw on canvas while active,
    // but we still clear the canvas to the world background for continuity.
    default:
      ctx.fillStyle = '#0a0a0f';
      ctx.fillRect(0, 0, W, H);
      break;
  }
  requestAnimationFrame(masterLoop);
}
requestAnimationFrame(masterLoop);
</script>
